  - code_value
- name: policy_financial_transaction_to_lifecycle_event
  description: Relates a policy financial transaction to the lifecycle event it realizes when applicable.
  cardinality: many-to-one
  targetContract: pc.policy-lifecycle-event
  targetTable: silver_policy.policy_lifecycle_event
  sourceFields:
  - policy_lifecycle_event_uid
  targetFields:
  - policy_lifecycle_event_uid
- name: policy_financial_transaction_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  cardinality: many-to-one
  targetContract: pc.source-system-code
  targetTable: silver_reference_data.source_system_code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
