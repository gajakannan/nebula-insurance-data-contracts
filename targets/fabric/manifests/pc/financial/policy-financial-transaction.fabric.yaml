manifestVersion: 1.0.0
contract:
  id: pc.policy-financial-transaction
  name: PolicyFinancialTransaction
  version: 0.2.2
  domain: property-and-casualty
  description: Canonical contract for policy-related financial activity such as premium movements, fee
    posts, commission accruals, surcharges, and other policy-side transactions.
  classificationProfile: CONFIDENTIAL
  subjectToHipaa: false
  contractKind: transaction
  subjectArea: financial
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - currency-convention
  - data-classification
  - event-and-transaction
  - financial-modeling
  - identifier-strategy
  - policy-lifecycle-modeling
  - status-promotion
  - temporal-modeling
  - versioning-policy
fabric:
  lakehouse: nebula_pc_silver
  schema: silver_financial
  table:
    name: policy_financial_transaction
    delta:
      tableProperties:
        delta.appendOnly: true
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - transaction_effective_date
      zorderBy: []
      vorder: true
  columns:
  - name: policy_financial_transaction_uid
    sparkType: STRING
    nullable: false
    primaryKey: true
    role: identity
    description: Immutable system-generated GUID that uniquely identifies the canonical policy financial
      transaction record across snapshots and source systems.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_system_code
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Identifier of the upstream system that produced or last asserted this record. Used for
      multi-source mastering and lineage.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.source-system-code
      codesetTable: silver_reference_data.source_system_code
      codesetField: code_value
  - name: source_natural_key
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical
      primary key.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: policy_uid
    sparkType: STRING
    nullable: false
    role: foreign-key
    description: Identifier (GUID reference) for the policy associated with the transaction.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy
      targetTable: silver_policy.policy
      targetField: policy_uid
  - name: account_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the commercial account the transaction rolls up to. Enables
      account-level financial rollups (master-program billing, account-level commission accruals) without
      traversing policy.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.account
      targetTable: silver_core.account
      targetField: account_uid
  - name: agreement_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the master legal or program agreement under which the
      transaction was booked, when applicable.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.agreement
      targetTable: silver_core.agreement
      targetField: agreement_uid
  - name: policy_term_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the policy term associated with the transaction when
      term context is known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-term
      targetTable: silver_policy.policy_term
      targetField: policy_term_uid
  - name: policy_coverage_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the policy coverage that the transaction is booked against
      when coverage-level allocation is known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-coverage
      targetTable: silver_coverage.policy_coverage
      targetField: policy_coverage_uid
  - name: payee_party_role_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the policy party role that is the payee of the transaction
      when applicable (e.g. agent commission, broker fee).
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-party-role
      targetTable: silver_policy.policy_party_role
      targetField: policy_party_role_uid
  - name: transaction_type_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Classification of the transaction such as PREMIUM, RETURN_PREMIUM, FEE, COMMISSION, SURCHARGE,
      TAX. References the TransactionType codeset.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.transaction-type
      codesetTable: silver_reference_data.transaction_type
      codesetField: code_value
  - name: transaction_classification_code
    sparkType: STRING
    nullable: true
    role: code-reference
    description: Optional secondary classification (e.g. WRITTEN_PREMIUM, EARNED_PREMIUM, FEE_POLICY,
      FEE_INSPECTION, COMMISSION_BASE, COMMISSION_OVERRIDE) used by analytics and reporting. References
      the FinancialTransactionClassification codeset.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.financial-transaction-classification
      codesetTable: silver_reference_data.financial_transaction_classification
      codesetField: code_value
  - name: transaction_amount
    sparkType: DECIMAL(18, 2)
    nullable: false
    role: monetary-amount
    description: Signed monetary amount of the transaction in the transactional currency. Sign convention
      is positive for charges to the insured, negative for credits and returns.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - FINANCIAL
    purview:
      sensitivityLabel: Confidential
    currencyPair:
      pairedColumn: transaction_currency_code
  - name: transaction_currency_code
    sparkType: STRING
    nullable: false
    role: monetary-currency
    description: Currency code for the transaction amount. References the CurrencyCode codeset.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.currency-code
      codesetTable: silver_reference_data.currency_code
      codesetField: code_value
  - name: transaction_effective_date
    sparkType: DATE
    nullable: false
    role: data
    description: Business-effective date of the transaction.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: transaction_processed_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: data
    description: Datetime when the transaction was processed or posted.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: accounting_period_code
    sparkType: STRING
    nullable: true
    role: data
    description: Accounting period to which the transaction is booked (e.g. YYYY-MM, YYYY-QN) when known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: policy_lifecycle_event_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Optional reference to the policy lifecycle event that this transaction realizes (per
      the event-and-transaction ADR).
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-lifecycle-event
      targetTable: silver_policy.policy_lifecycle_event
      targetField: policy_lifecycle_event_uid
  - name: transaction_narrative
    sparkType: STRING
    nullable: true
    role: data
    description: Source-neutral narrative describing the transaction when additional context is needed.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: correction_indicator
    sparkType: BOOLEAN
    nullable: false
    role: event-correction-flag
    description: True when this row corrects a previously emitted row. False for original (uncorrected)
      rows.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: corrects_policy_financial_transaction_uid
    sparkType: STRING
    nullable: true
    role: event-corrects-ref
    description: Reference to the prior row that this row corrects. Populated only when correction_indicator
      is true.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  scd2:
    enabled: false
    validFrom: null
    validTo: null
    isCurrent: null
    naturalKey: []
    deletionAware: false
    changeDetection:
      excludeFromHashing: []
  recordState:
    enabled: false
    field: null
    activeValue: null
    supersededValue: null
    softDeletedValue: null
  appendOnly:
    enabled: true
    correctionIndicator: correction_indicator
    correctsRefField: corrects_policy_financial_transaction_uid
    businessTimeField: transaction_effective_date
    partitionExpression: MONTH(transaction_effective_date)
  qualityRules:
  - id: policy_financial_transaction_uid_required
    type: not_null
    column: policy_financial_transaction_uid
    severity: error
    sourceRule: policy_financial_transaction_uid_required
  - id: policy_financial_transaction_policy_uid_required
    type: not_null
    column: policy_uid
    severity: error
    sourceRule: policy_financial_transaction_policy_uid_required
  - id: policy_financial_transaction_type_code_required
    type: not_null
    column: transaction_type_code
    severity: error
    sourceRule: policy_financial_transaction_type_code_required
  - id: policy_financial_transaction_amount_required
    type: not_null
    column: transaction_amount
    severity: error
    sourceRule: policy_financial_transaction_amount_required
  - id: policy_financial_transaction_currency_required
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: Transaction currency code must be populated
      whenever transaction amount is populated.'
    severity: error
    sourceRule: policy_financial_transaction_currency_required
  - id: policy_financial_transaction_effective_date_required
    type: not_null
    column: transaction_effective_date
    severity: error
    sourceRule: policy_financial_transaction_effective_date_required
  - id: correction_indicator_required
    type: not_null
    column: correction_indicator
    severity: error
    sourceRule: correction_indicator_required
  - id: transaction_amount_currency_pair
    type: currency_pair
    amountColumn: transaction_amount
    currencyColumn: transaction_currency_code
    severity: error
    sourceRule: derived
  - id: source_system_code_in_codeset
    type: accepted_values
    column: source_system_code
    codeset: pc.source-system-code
    codesetTable: silver_reference_data.source_system_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: transaction_type_code_in_codeset
    type: accepted_values
    column: transaction_type_code
    codeset: pc.transaction-type
    codesetTable: silver_reference_data.transaction_type
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: transaction_classification_code_in_codeset
    type: accepted_values
    column: transaction_classification_code
    codeset: pc.financial-transaction-classification
    codesetTable: silver_reference_data.financial_transaction_classification
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: transaction_currency_code_in_codeset
    type: accepted_values
    column: transaction_currency_code
    codeset: pc.currency-code
    codesetTable: silver_reference_data.currency_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  bronze:
    table: bronze.policy_financial_transaction_raw
    incrementalColumn: _ingested_at
    expectedColumns:
    - policy_financial_transaction_uid
    - source_system_code
    - source_natural_key
    - policy_uid
    - account_uid
    - agreement_uid
    - policy_term_uid
    - policy_coverage_uid
    - payee_party_role_uid
    - transaction_type_code
    - transaction_classification_code
    - transaction_amount
    - transaction_currency_code
    - transaction_effective_date
    - transaction_processed_datetime
    - accounting_period_code
    - policy_lifecycle_event_uid
    - transaction_narrative
    - correction_indicator
    - corrects_policy_financial_transaction_uid
relationships:
- name: policy_financial_transaction_to_policy
  description: Relates a policy financial transaction to the policy associated with the transaction.
  cardinality: many-to-one
  targetContract: pc.policy
  targetTable: silver_policy.policy
  sourceFields:
  - policy_uid
  targetFields:
  - policy_uid
- name: policy_financial_transaction_to_account
  description: Relates a policy financial transaction directly to the commercial account it rolls up to
    for account-level financial rollups.
  cardinality: many-to-one
  targetContract: pc.account
  targetTable: silver_core.account
  sourceFields:
  - account_uid
  targetFields:
  - account_uid
- name: policy_financial_transaction_to_agreement
  description: Relates a policy financial transaction to the master legal or program agreement under which
    the transaction was booked when applicable.
  cardinality: many-to-one
  targetContract: pc.agreement
  targetTable: silver_core.agreement
  sourceFields:
  - agreement_uid
  targetFields:
  - agreement_uid
- name: policy_financial_transaction_to_policy_term
  description: Relates a policy financial transaction to the policy term when term context is known.
  cardinality: many-to-one
  targetContract: pc.policy-term
  targetTable: silver_policy.policy_term
  sourceFields:
  - policy_term_uid
  targetFields:
  - policy_term_uid
- name: policy_financial_transaction_to_policy_coverage
  description: Relates a policy financial transaction to the policy coverage that it is booked against
    when coverage-level allocation is known.
  cardinality: many-to-one
  targetContract: pc.policy-coverage
  targetTable: silver_coverage.policy_coverage
  sourceFields:
  - policy_coverage_uid
  targetFields:
  - policy_coverage_uid
- name: policy_financial_transaction_to_payee_party_role
  description: Relates a policy financial transaction to the policy party role that is the payee when
    applicable.
  cardinality: many-to-one
  targetContract: pc.policy-party-role
  targetTable: silver_policy.policy_party_role
