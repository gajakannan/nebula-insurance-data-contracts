  targetFields:
  - exposure_uid
- name: financial_transaction_transaction_type_code_to_transaction_type
  description: Binds transaction_type_code to the canonical transaction-type codeset.
  cardinality: many-to-one
  targetContract: pc.transaction-type
  targetTable: silver_reference_data.transaction_type
  sourceFields:
  - transaction_type_code
  targetFields:
  - code_value
- name: financial_transaction_transaction_classification_code_to_financial_transaction_classification
  description: Binds transaction_classification_code to the canonical financial-transaction-classification
    codeset.
  cardinality: many-to-one
  targetContract: pc.financial-transaction-classification
  targetTable: silver_reference_data.financial_transaction_classification
  sourceFields:
  - transaction_classification_code
  targetFields:
  - code_value
- name: financial_transaction_transaction_currency_code_to_currency_code
  description: Binds transaction_currency_code to the canonical currency-code codeset.
  cardinality: many-to-one
  targetContract: pc.currency-code
  targetTable: silver_reference_data.currency_code
  sourceFields:
  - transaction_currency_code
  targetFields:
  - code_value
