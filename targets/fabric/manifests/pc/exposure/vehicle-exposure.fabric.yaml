    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: vehicle_make_name
    sparkType: STRING
    nullable: true
    role: data
    description: Manufacturer or make name of the vehicle.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: vehicle_model_name
    sparkType: STRING
    nullable: true
    role: data
    description: Model name of the vehicle.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: vehicle_use_code
    sparkType: STRING
    nullable: true
    role: data
