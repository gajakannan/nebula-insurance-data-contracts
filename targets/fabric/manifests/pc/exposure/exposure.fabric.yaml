  targetFields:
  - policy_coverage_uid
- name: exposure_to_insurable_object
  description: Relates an exposure to the insurable object that may be insured when object detail is represented
    separately.
  cardinality: many-to-one
  targetContract: pc.insurable-object
  targetTable: silver_exposure.insurable_object
  sourceFields:
