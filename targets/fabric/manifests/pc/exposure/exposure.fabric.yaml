- name: exposure_to_geographic_location
  description: Relates an exposure to the geographic location associated with the risk basis when location
    detail is available.
  cardinality: many-to-one
  targetContract: pc.geographic-location
  targetTable: silver_reference_data.geographic_location
  sourceFields:
