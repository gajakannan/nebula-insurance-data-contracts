    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: year_built_number
    sparkType: INT
    nullable: true
    role: business-key
    description: Year the property structure was built.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: square_footage_count
    sparkType: INT
    nullable: true
    role: data
    description: Area of the property structure measured in square feet when applicable.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: building_value_amount
    sparkType: DECIMAL(18, 2)
    nullable: true
    role: monetary-amount
    description: Valuation amount for the building or structure when used for underwriting, rating, or
