      codesetField: geographic_location_uid
  - name: property_use_code
    sparkType: STRING
    nullable: true
    role: data
    description: Classification of how the property is used in the insured context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: occupancy_type_code
    sparkType: STRING
    nullable: true
    role: data
    description: Classification of the occupancy associated with the property exposure.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: construction_type_code
    sparkType: STRING
    nullable: true
    role: data
    description: Classification of the construction type associated with the property exposure.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: protection_class_code
    sparkType: STRING
    nullable: true
    role: data
    description: Fire protection or public protection classification associated with the property exposure
