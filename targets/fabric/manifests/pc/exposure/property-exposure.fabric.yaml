    severity: error
    sourceRule: derived
  - id: building_value_currency_code_in_codeset
    type: accepted_values
    column: building_value_currency_code
    codeset: pc.currency-code
    codesetTable: silver_reference_data.currency_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: contents_value_currency_code_in_codeset
    type: accepted_values
    column: contents_value_currency_code
    codeset: pc.currency-code
    codesetTable: silver_reference_data.currency_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: record_status_code_in_codeset
    type: accepted_values
    column: record_status_code
