manifestVersion: 1.0.0
contract:
  id: pc.account-relationship
  name: AccountRelationship
  version: 0.1.1
  domain: property-and-casualty
  description: Canonical contract for relationships between accounts — corporate hierarchies, billing
    parents, master programs, ultimate parents, and merger restructurings.
  classificationProfile: CONFIDENTIAL
  subjectToHipaa: false
  contractKind: entity
  subjectArea: core
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - entity-boundaries
  - identifier-strategy
  - null-semantics
  - record-state
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
fabric:
  lakehouse: nebula_pc_silver
  schema: silver_core
  table:
    name: account_relationship
    delta:
      tableProperties:
        delta.appendOnly: false
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - is_current_indicator
      zorderBy:
      - account_relationship_uid
      vorder: true
  columns:
  - name: account_relationship_uid
    sparkType: STRING
    nullable: false
    primaryKey: true
    role: identity
    description: Immutable system-generated GUID that uniquely identifies the canonical account relationship
      record across snapshots and source systems.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_system_code
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Identifier of the upstream system that produced or last asserted this record. Used for
      multi-source mastering and lineage.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.source-system-code
      codesetTable: silver_reference_data.source_system_code
      codesetField: code_value
  - name: source_natural_key
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical
      primary key.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: from_account_uid
    sparkType: STRING
    nullable: false
    role: foreign-key
    description: Identifier (GUID reference) for the originating account in the relationship.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.account
      targetTable: silver_core.account
      targetField: account_uid
  - name: to_account_uid
    sparkType: STRING
    nullable: false
    role: foreign-key
    description: Identifier (GUID reference) for the receiving account in the relationship (e.g. the parent
      in a parent-child relationship).
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.account
      targetTable: silver_core.account
      targetField: account_uid
  - name: relationship_type_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Classification of the relationship (PARENT, BILLING_PARENT, UNDERWRITING_PARENT, MASTER_PROGRAM,
      ULTIMATE_PARENT, MERGED_INTO, DEMERGED_FROM, etc.). References the AccountRelationshipTypeCode codeset.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.account-relationship-type-code
      codesetTable: silver_reference_data.account_relationship_type_code
      codesetField: code_value
  - name: relationship_status_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Current lifecycle status of the relationship. References the RelationshipStatusCode codeset.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.relationship-status-code
      codesetTable: silver_reference_data.relationship_status_code
      codesetField: code_value
  - name: relationship_description
    sparkType: STRING
    nullable: true
    role: data
    description: Source-neutral business description of the relationship when additional context is needed.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: effective_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the relationship becomes effective.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: expiration_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the relationship stops being effective.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: record_status_code
    sparkType: STRING
    nullable: false
    role: record-state
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE,
      SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.record-status-code
      codesetTable: silver_reference_data.record_status_code
      codesetField: code_value
  - name: valid_from_datetime
    sparkType: TIMESTAMP
    nullable: false
    primaryKey: true
    role: scd2-valid-from
    description: System-time start of the SCD2 window for this record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: valid_to_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: scd2-valid-to
    description: System-time end of the SCD2 window for this record version. Null indicates the current
      row.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: is_current_indicator
    sparkType: BOOLEAN
    nullable: false
    role: scd2-is-current
    description: True for exactly one row per logical key, indicating the current record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  scd2:
    enabled: true
    validFrom: valid_from_datetime
    validTo: valid_to_datetime
    isCurrent: is_current_indicator
    naturalKey:
    - account_relationship_uid
    deletionAware: false
    changeDetection:
      excludeFromHashing:
      - valid_from_datetime
      - valid_to_datetime
      - is_current_indicator
      - record_status_code
  recordState:
    enabled: true
    field: record_status_code
    activeValue: ACTIVE
    supersededValue: SUPERSEDED
    softDeletedValue: SOFT_DELETED
  appendOnly:
    enabled: false
    correctionIndicator: null
    correctsRefField: null
    businessTimeField: null
    partitionExpression: null
  qualityRules:
  - id: account_relationship_uid_required
    type: not_null
    column: account_relationship_uid
    severity: error
    sourceRule: account_relationship_uid_required
  - id: account_relationship_from_account_uid_required
    type: not_null
    column: from_account_uid
    severity: error
    sourceRule: account_relationship_from_account_uid_required
  - id: account_relationship_to_account_uid_required
    type: not_null
    column: to_account_uid
    severity: error
    sourceRule: account_relationship_to_account_uid_required
  - id: account_relationship_type_code_required
    type: not_null
    column: relationship_type_code
    severity: error
    sourceRule: account_relationship_type_code_required
  - id: account_relationship_not_self_reference
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: from_account_uid must not equal to_account_uid
      for any record.'
    severity: error
    sourceRule: account_relationship_not_self_reference
  - id: account_relationship_effective_not_after_expiration
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: Effective date must not be later than
      expiration date when both dates are populated.'
    severity: error
    sourceRule: account_relationship_effective_not_after_expiration
  - id: valid_from_datetime_required
    type: not_null
    column: valid_from_datetime
    severity: error
    sourceRule: valid_from_datetime_required
  - id: valid_window_consistent
    type: expression
    expression: valid_to_datetime IS NULL OR valid_to_datetime > valid_from_datetime
    severity: error
    sourceRule: valid_window_consistent
  - id: single_current_row_per_key
    type: unique
    keyColumns:
    - account_relationship_uid
    filter: is_current_indicator = true
    severity: error
    sourceRule: single_current_row_per_key
  - id: record_status_code_required
    type: not_null
    column: record_status_code
    severity: error
    sourceRule: record_status_code_required
  - id: source_system_code_in_codeset
    type: accepted_values
    column: source_system_code
    codeset: pc.source-system-code
    codesetTable: silver_reference_data.source_system_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: relationship_type_code_in_codeset
    type: accepted_values
    column: relationship_type_code
    codeset: pc.account-relationship-type-code
    codesetTable: silver_reference_data.account_relationship_type_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: relationship_status_code_in_codeset
    type: accepted_values
    column: relationship_status_code
    codeset: pc.relationship-status-code
    codesetTable: silver_reference_data.relationship_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: record_status_code_in_codeset
    type: accepted_values
    column: record_status_code
    codeset: pc.record-status-code
    codesetTable: silver_reference_data.record_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  bronze:
    table: bronze.account_relationship_raw
    incrementalColumn: _ingested_at
    expectedColumns:
    - account_relationship_uid
    - source_system_code
    - source_natural_key
    - from_account_uid
    - to_account_uid
    - relationship_type_code
    - relationship_status_code
    - relationship_description
    - effective_date
    - expiration_date
    - record_status_code
    - valid_from_datetime
    - valid_to_datetime
    - is_current_indicator
relationships:
- name: account_relationship_from_account
  description: Relates the relationship to the originating account.
  cardinality: many-to-one
  targetContract: pc.account
  targetTable: silver_core.account
  sourceFields:
  - from_account_uid
  targetFields:
  - account_uid
- name: account_relationship_to_account
  description: Relates the relationship to the receiving account.
  cardinality: many-to-one
  targetContract: pc.account
  targetTable: silver_core.account
  sourceFields:
  - to_account_uid
  targetFields:
  - account_uid
- name: account_relationship_to_relationship_type
  description: Relates the relationship to the AccountRelationshipTypeCode codeset.
  cardinality: many-to-one
  targetContract: pc.account-relationship-type-code
  targetTable: silver_reference_data.account_relationship_type_code
  sourceFields:
  - relationship_type_code
  targetFields:
  - code_value
- name: account_relationship_to_relationship_status
  description: Relates the relationship to the RelationshipStatusCode codeset.
  cardinality: many-to-one
  targetContract: pc.relationship-status-code
  targetTable: silver_reference_data.relationship_status_code
  sourceFields:
  - relationship_status_code
  targetFields:
  - code_value
- name: account_relationship_to_record_status
  description: Relates the relationship to the RecordStatusCode codeset.
  cardinality: many-to-one
  targetContract: pc.record-status-code
  targetTable: silver_reference_data.record_status_code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
- name: account_relationship_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  cardinality: many-to-one
  targetContract: pc.source-system-code
  targetTable: silver_reference_data.source_system_code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
