manifestVersion: 1.0.0
contract:
  id: pc.policy-transaction
  name: PolicyTransaction
  version: 0.4.0
  domain: property-and-casualty
  description: Canonical contract for transaction-level policy activity in Property and Casualty insurance.
  classificationProfile: CONFIDENTIAL
  subjectToHipaa: false
  contractKind: transaction
  subjectArea: policy
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - currency-convention
  - data-classification
  - event-and-transaction
  - financial-modeling
  - identifier-strategy
  - policy-lifecycle-modeling
  - status-promotion
  - temporal-modeling
  - versioning-policy
fabric:
  lakehouse: nebula_pc_silver
  schema: silver_policy
  table:
    name: policy_transaction
    delta:
      tableProperties:
        delta.appendOnly: true
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - transaction_effective_date
      zorderBy: []
      vorder: true
  columns:
  - name: policy_transaction_uid
    sparkType: STRING
    nullable: false
    primaryKey: true
    role: identity
    description: Immutable system-generated GUID that uniquely identifies the canonical policy transaction
      record across snapshots and source systems.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: policy_uid
    sparkType: STRING
    nullable: false
    role: foreign-key
    description: Identifier (GUID reference) for the policy associated with the transaction.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy
      targetTable: silver_policy.policy
      targetField: policy_uid
  - name: policy_term_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the policy term associated with the transaction when
      term context is known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-term
      targetTable: silver_policy.policy_term
      targetField: policy_term_uid
  - name: policy_lifecycle_event_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the policy lifecycle event associated with the transaction
      when event context is known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-lifecycle-event
      targetTable: silver_policy.policy_lifecycle_event
      targetField: policy_lifecycle_event_uid
  - name: transaction_type_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Business-facing code for the policy transaction type.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.transaction-type
      codesetTable: silver_reference_data.transaction_type
      codesetField: code_value
  - name: transaction_effective_date
    sparkType: DATE
    nullable: false
    role: data
    description: Date when the policy transaction takes business effect.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: transaction_processed_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: data
    description: Datetime when the policy transaction was processed or recorded.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: transaction_sequence_number
    sparkType: INT
    nullable: true
    role: business-key
    description: Sequence number used to order policy transactions within a policy or term context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: requested_by_party_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the party that requested the policy transaction when
      known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.party
      targetTable: silver_core.party
      targetField: party_uid
  - name: processed_by_party_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the party that processed or is accountable for the policy
      transaction when known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.party
      targetTable: silver_core.party
      targetField: party_uid
  - name: premium_change_amount
    sparkType: DECIMAL(18, 2)
    nullable: true
    role: monetary-amount
    description: Monetary premium change associated with the policy transaction when available.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - FINANCIAL
    purview:
      sensitivityLabel: Confidential
    currencyPair:
      pairedColumn: premium_change_currency_code
  - name: premium_change_currency_code
    sparkType: STRING
    nullable: true
    role: monetary-currency
    description: Currency code for the premium change amount.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.currency-code
      codesetTable: silver_reference_data.currency_code
      codesetField: code_value
  - name: transaction_description
    sparkType: STRING
    nullable: true
    role: data
    description: Source-neutral business description of the policy transaction when additional context
      is needed.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: correction_indicator
    sparkType: BOOLEAN
    nullable: false
    role: event-correction-flag
    description: True when this row corrects a previously emitted row. False for original (uncorrected)
      rows.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: corrects_policy_transaction_uid
    sparkType: STRING
    nullable: true
    role: event-corrects-ref
    description: Reference to the prior row that this row corrects. Populated only when correction_indicator
      is true.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  scd2:
    enabled: false
    validFrom: null
    validTo: null
    isCurrent: null
    naturalKey: []
    deletionAware: false
    changeDetection:
      excludeFromHashing: []
  recordState:
    enabled: false
    field: null
    activeValue: null
    supersededValue: null
    softDeletedValue: null
  appendOnly:
    enabled: true
    correctionIndicator: correction_indicator
    correctsRefField: corrects_policy_transaction_uid
    businessTimeField: transaction_effective_date
    partitionExpression: MONTH(transaction_effective_date)
  qualityRules:
  - id: policy_transaction_uid_required
    type: not_null
    column: policy_transaction_uid
    severity: error
    sourceRule: policy_transaction_uid_required
  - id: policy_transaction_policy_uid_required
    type: not_null
    column: policy_uid
    severity: error
    sourceRule: policy_transaction_policy_uid_required
  - id: policy_transaction_type_code_required
    type: not_null
    column: transaction_type_code
    severity: error
    sourceRule: policy_transaction_type_code_required
  - id: policy_transaction_effective_date_required
    type: not_null
    column: transaction_effective_date
    severity: error
    sourceRule: policy_transaction_effective_date_required
  - id: policy_transaction_premium_change_has_currency
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: Premium currency code should be populated
      when premium change amount is populated.'
    severity: warning
    sourceRule: policy_transaction_premium_change_has_currency
  - id: correction_indicator_required
    type: not_null
    column: correction_indicator
    severity: error
    sourceRule: correction_indicator_required
  - id: premium_change_amount_currency_pair
    type: currency_pair
    amountColumn: premium_change_amount
    currencyColumn: premium_change_currency_code
    severity: error
    sourceRule: derived
  - id: transaction_type_code_in_codeset
    type: accepted_values
    column: transaction_type_code
    codeset: pc.transaction-type
    codesetTable: silver_reference_data.transaction_type
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: premium_change_currency_code_in_codeset
    type: accepted_values
    column: premium_change_currency_code
    codeset: pc.currency-code
    codesetTable: silver_reference_data.currency_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  bronze:
    table: bronze.policy_transaction_raw
    incrementalColumn: _ingested_at
    expectedColumns:
    - policy_transaction_uid
    - policy_uid
    - policy_term_uid
    - policy_lifecycle_event_uid
    - transaction_type_code
    - transaction_effective_date
    - transaction_processed_datetime
    - transaction_sequence_number
    - requested_by_party_uid
    - processed_by_party_uid
    - premium_change_amount
    - premium_change_currency_code
    - transaction_description
    - correction_indicator
    - corrects_policy_transaction_uid
relationships:
- name: policy_transaction_to_policy
  description: Relates a policy transaction to the policy associated with the transaction.
  cardinality: many-to-one
  targetContract: pc.policy
  targetTable: silver_policy.policy
  sourceFields:
  - policy_uid
  targetFields:
  - policy_uid
- name: policy_transaction_to_policy_term
  description: Relates a policy transaction to the policy term associated with the transaction when term
    context is known.
  cardinality: many-to-one
  targetContract: pc.policy-term
  targetTable: silver_policy.policy_term
  sourceFields:
  - policy_term_uid
  targetFields:
  - policy_term_uid
- name: policy_transaction_to_policy_lifecycle_event
  description: Relates a policy transaction to the policy lifecycle event associated with the transaction
    when event context is known.
  cardinality: many-to-one
  targetContract: pc.policy-lifecycle-event
  targetTable: silver_policy.policy_lifecycle_event
  sourceFields:
  - policy_lifecycle_event_uid
  targetFields:
  - policy_lifecycle_event_uid
- name: policy_transaction_to_transaction_type
  description: Relates a policy transaction to transaction type reference data when available.
  cardinality: many-to-one
  targetContract: pc.transaction-type
  targetTable: silver_reference_data.transaction_type
  sourceFields:
  - transaction_type_code
  targetFields:
  - code_value
- name: policy_transaction_to_requested_by_party
  description: Relates a policy transaction to the party that requested it when known.
  cardinality: many-to-one
  targetContract: pc.party
  targetTable: silver_core.party
  sourceFields:
  - requested_by_party_uid
  targetFields:
  - party_uid
- name: policy_transaction_to_processed_by_party
  description: Relates a policy transaction to the party that processed or is accountable for it when
    known.
  cardinality: many-to-one
  targetContract: pc.party
  targetTable: silver_core.party
  sourceFields:
  - processed_by_party_uid
  targetFields:
  - party_uid
- name: policy_transaction_premium_change_currency_code_to_currency_code
  description: Binds premium_change_currency_code to the canonical currency-code codeset.
  cardinality: many-to-one
  targetContract: pc.currency-code
  targetTable: silver_reference_data.currency_code
  sourceFields:
  - premium_change_currency_code
  targetFields:
  - code_value
