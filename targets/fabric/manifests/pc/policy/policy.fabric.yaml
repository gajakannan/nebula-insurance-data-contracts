  sourceFields:
  - line_of_business_code
  targetFields:
  - code_value
- name: policy_issuing_jurisdiction_code_to_jurisdiction_code
  description: Binds issuing_jurisdiction_code to the canonical jurisdiction-code codeset.
  cardinality: many-to-one
  targetContract: pc.jurisdiction-code
  targetTable: silver_reference_data.jurisdiction_code
  sourceFields:
  - issuing_jurisdiction_code
  targetFields:
  - code_value
- name: policy_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  cardinality: many-to-one
  targetContract: pc.record-status-code
  targetTable: silver_reference_data.record_status_code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
