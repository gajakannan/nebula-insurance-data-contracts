fabric:
  lakehouse: nebula_pc_silver
  schema: silver_policy
  table:
    name: policy_term
    delta:
      tableProperties:
        delta.appendOnly: false
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - is_current_indicator
      zorderBy:
      - policy_term_uid
      vorder: true
  columns:
  - name: policy_term_uid
    sparkType: STRING
    nullable: false
    primaryKey: true
    role: identity
    description: Immutable system-generated GUID that uniquely identifies the canonical policy term record
      across snapshots and source systems.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_system_code
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Identifier of the upstream system that produced or last asserted this record. Used for
      multi-source mastering and lineage.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.source-system-code
      codesetTable: silver_reference_data.source_system_code
      codesetField: code_value
  - name: source_natural_key
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical
      primary key.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: policy_uid
    sparkType: STRING
    nullable: false
    role: foreign-key
    description: Identifier (GUID reference) for the policy associated with the term.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy
      targetTable: silver_policy.policy
      targetField: policy_uid
  - name: policy_term_number
    sparkType: INT
    nullable: true
    role: business-key
    description: Sequence number or ordinal value for the policy term within the durable policy history.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: policy_term_status_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Current lifecycle status of the policy term.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.term-status-code
      codesetTable: silver_reference_data.term_status_code
      codesetField: code_value
  - name: term_effective_date
    sparkType: DATE
    nullable: false
    role: data
    description: Date when the policy term becomes effective.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: term_expiration_date
    sparkType: DATE
    nullable: false
    role: data
    description: Date when the policy term expires.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: cancellation_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the policy term is cancelled when cancellation applies.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: renewal_indicator
    sparkType: BOOLEAN
    nullable: true
    role: data
    description: Indicates whether the policy term represents a renewal term.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: annualized_premium_amount
    sparkType: DECIMAL(18, 2)
    nullable: true
    role: monetary-amount
    description: Annualized premium amount associated with the policy term when available.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - FINANCIAL
    purview:
      sensitivityLabel: Confidential
    currencyPair:
      pairedColumn: annualized_premium_currency_code
  - name: annualized_premium_currency_code
    sparkType: STRING
    nullable: true
    role: monetary-currency
    description: Currency code for the annualized premium amount.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.currency-code
      codesetTable: silver_reference_data.currency_code
      codesetField: code_value
  - name: source_created_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: source-time
    description: Source-system timestamp asserting when this record was created. Captured for late-arriving-data
      analysis; distinct from the SCD2 system-time start in valid_from_datetime.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_updated_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: source-time
    description: Source-system timestamp asserting when this record was last updated. Captured for late-arriving-data
      analysis; distinct from the SCD2 system-time markers valid_from_datetime / valid_to_datetime.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: record_status_code
    sparkType: STRING
    nullable: false
    role: record-state
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE,
      SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.record-status-code
      codesetTable: silver_reference_data.record_status_code
      codesetField: code_value
  - name: valid_from_datetime
    sparkType: TIMESTAMP
    nullable: false
    primaryKey: true
    role: scd2-valid-from
    description: System-time start of the SCD2 window for this record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: valid_to_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: scd2-valid-to
    description: System-time end of the SCD2 window for this record version. Null indicates the current
      row.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: is_current_indicator
    sparkType: BOOLEAN
    nullable: false
    role: scd2-is-current
    description: True for exactly one row per logical key, indicating the current record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  scd2:
    enabled: true
    validFrom: valid_from_datetime
    validTo: valid_to_datetime
    isCurrent: is_current_indicator
    naturalKey:
    - policy_term_uid
    deletionAware: false
    changeDetection:
      excludeFromHashing:
      - valid_from_datetime
      - valid_to_datetime
      - is_current_indicator
      - record_status_code
  recordState:
    enabled: true
    field: record_status_code
    activeValue: ACTIVE
    supersededValue: SUPERSEDED
    softDeletedValue: SOFT_DELETED
  appendOnly:
    enabled: false
    correctionIndicator: null
    correctsRefField: null
    businessTimeField: null
    partitionExpression: null
  qualityRules:
  - id: policy_term_uid_required
    type: not_null
    column: policy_term_uid
    severity: error
    sourceRule: policy_term_uid_required
  - id: policy_term_policy_uid_required
    type: not_null
    column: policy_uid
    severity: error
    sourceRule: policy_term_policy_uid_required
  - id: policy_term_status_code_required
    type: not_null
    column: policy_term_status_code
    severity: error
    sourceRule: policy_term_status_code_required
  - id: policy_term_dates_required
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: Term effective date and term expiration
      date must be populated for every policy term.'
    severity: error
    sourceRule: policy_term_dates_required
  - id: policy_term_effective_date_before_expiration_date
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: Term effective date must be earlier
      than term expiration date.'
    severity: error
    sourceRule: policy_term_effective_date_before_expiration_date
  - id: policy_term_annualized_premium_not_negative
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: Annualized premium amount should not
      be negative when populated.'
    severity: warning
    sourceRule: policy_term_annualized_premium_not_negative
  - id: valid_from_datetime_required
    type: not_null
    column: valid_from_datetime
    severity: error
    sourceRule: valid_from_datetime_required
  - id: valid_window_consistent
    type: expression
    expression: valid_to_datetime IS NULL OR valid_to_datetime > valid_from_datetime
    severity: error
    sourceRule: valid_window_consistent
  - id: single_current_row_per_key
    type: unique
    keyColumns:
    - policy_term_uid
    filter: is_current_indicator = true
    severity: error
    sourceRule: single_current_row_per_key
  - id: record_status_code_required
    type: not_null
    column: record_status_code
    severity: error
    sourceRule: record_status_code_required
  - id: annualized_premium_amount_currency_pair
    type: currency_pair
    amountColumn: annualized_premium_amount
    currencyColumn: annualized_premium_currency_code
    severity: error
    sourceRule: derived
  - id: source_system_code_in_codeset
    type: accepted_values
    column: source_system_code
    codeset: pc.source-system-code
    codesetTable: silver_reference_data.source_system_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: policy_term_status_code_in_codeset
    type: accepted_values
    column: policy_term_status_code
    codeset: pc.term-status-code
    codesetTable: silver_reference_data.term_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: annualized_premium_currency_code_in_codeset
    type: accepted_values
    column: annualized_premium_currency_code
    codeset: pc.currency-code
    codesetTable: silver_reference_data.currency_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: record_status_code_in_codeset
    type: accepted_values
    column: record_status_code
    codeset: pc.record-status-code
    codesetTable: silver_reference_data.record_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  bronze:
    table: bronze.policy_term_raw
    incrementalColumn: _ingested_at
    expectedColumns:
    - policy_term_uid
    - source_system_code
    - source_natural_key
    - policy_uid
    - policy_term_number
    - policy_term_status_code
    - term_effective_date
    - term_expiration_date
    - cancellation_date
    - renewal_indicator
    - annualized_premium_amount
    - annualized_premium_currency_code
    - source_created_datetime
    - source_updated_datetime
    - record_status_code
    - valid_from_datetime
    - valid_to_datetime
    - is_current_indicator
