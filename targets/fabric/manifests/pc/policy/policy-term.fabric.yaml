  name: PolicyTerm
  version: 0.4.2
  domain: property-and-casualty
  description: Canonical contract for a term period associated with a Property and Casualty policy.
  classificationProfile: CONFIDENTIAL
  subjectToHipaa: false
  contractKind: entity
