      codesetTable: silver_reference_data.geographic_location
      codesetField: geographic_location_uid
  - name: address_type_code
    sparkType: STRING
    nullable: true
    role: data
    description: Classification of the address use or address type.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: address_line_1
    sparkType: STRING
    nullable: true
    role: data
    description: First address line for the location address.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: address_line_2
    sparkType: STRING
    nullable: true
    role: data
    description: Second address line for the location address.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: city_name
    sparkType: STRING
    nullable: true
    role: data
    description: City, town, municipality, or comparable locality name for the address.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: country_subdivision_code
    sparkType: STRING
    nullable: true
    role: data
    description: State, province, territory, or other first-level country subdivision code for the address.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: postal_code
    sparkType: STRING
    nullable: true
    role: data
    description: Postal or ZIP code for the address.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: country_code
    sparkType: STRING
    nullable: false
    role: data
    description: Country code for the address.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: effective_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the address becomes effective for canonical use.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: expiration_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the address stops being effective for canonical use.
    classifications:
      sensitivity: INTERNAL
