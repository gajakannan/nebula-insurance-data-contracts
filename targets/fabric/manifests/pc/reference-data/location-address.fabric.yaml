    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: geographic_location_uid
    sparkType: STRING
    nullable: false
    role: data
    description: Identifier (GUID reference) for the geographic location described by the address.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
