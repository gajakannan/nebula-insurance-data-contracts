  name: LocationAddress
  version: 0.3.1
  domain: property-and-casualty
  description: Canonical contract for address reference data associated with a geographic location in
    Property and Casualty insurance.
  classificationProfile: CONFIDENTIAL
  subjectToHipaa: false
  contractKind: codeset
  subjectArea: reference-data
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - entity-boundaries
  - identifier-strategy
  - record-state
  - scd2-primary-key
  - separation-and-nesting
  - status-promotion
  - temporal-modeling
  - versioning-policy
fabric:
  lakehouse: nebula_pc_silver
  schema: silver_reference_data
  table:
    name: location_address
    delta:
      tableProperties:
        delta.appendOnly: false
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - is_current_indicator
      zorderBy:
      - location_address_uid
      vorder: true
  columns:
