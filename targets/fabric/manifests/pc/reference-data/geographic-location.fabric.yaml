fabric:
  lakehouse: nebula_pc_silver
  schema: silver_reference_data
  table:
    name: geographic_location
    delta:
      tableProperties:
        delta.appendOnly: false
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - is_current_indicator
      zorderBy:
      - geographic_location_uid
      vorder: true
  columns:
  - name: geographic_location_uid
    sparkType: STRING
    nullable: false
    primaryKey: true
    role: identity
    description: Immutable system-generated GUID that uniquely identifies the canonical geographic location
      record across snapshots and source systems.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_system_code
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Identifier of the upstream system that produced or last asserted this record. Used for
      multi-source mastering and lineage.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_natural_key
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical
      primary key.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: location_type_code
    sparkType: STRING
    nullable: false
    role: data
    description: Classification of the geographic location, such as country, jurisdiction, county, city,
      postal area, territory, coordinates, or addressable place.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: location_name
    sparkType: STRING
    nullable: true
    role: data
    description: Business-facing name for the geographic location.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: country_code
    sparkType: STRING
    nullable: false
    role: data
    description: Country code associated with the geographic location.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: country_subdivision_code
    sparkType: STRING
    nullable: true
    role: data
    description: State, province, territory, or other first-level country subdivision code associated
      with the geographic location.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: county_name
    sparkType: STRING
    nullable: true
    role: data
    description: County, parish, borough, or comparable local jurisdiction name associated with the geographic
      location.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: city_name
    sparkType: STRING
    nullable: true
    role: data
    description: City, town, municipality, or comparable locality name associated with the geographic
      location.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: postal_code
    sparkType: STRING
    nullable: true
    role: data
    description: Postal or ZIP code associated with the geographic location.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: latitude_number
    sparkType: DECIMAL(18, 2)
    nullable: true
    role: business-key
    description: Latitude coordinate associated with the geographic location.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: longitude_number
    sparkType: DECIMAL(18, 2)
    nullable: true
    role: business-key
    description: Longitude coordinate associated with the geographic location.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: geocode_precision_code
    sparkType: STRING
    nullable: true
    role: data
    description: Classification of the precision level for the geographic coordinates when coordinates
      are populated.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: effective_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the geographic location reference record becomes effective for canonical use.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: expiration_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the geographic location reference record stops being effective for canonical
      use.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_created_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: source-time
    description: Source-system timestamp asserting when this record was created. Captured for late-arriving-data
      analysis; distinct from the SCD2 system-time start in valid_from_datetime.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_updated_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: source-time
    description: Source-system timestamp asserting when this record was last updated. Captured for late-arriving-data
      analysis; distinct from the SCD2 system-time markers valid_from_datetime / valid_to_datetime.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: record_status_code
    sparkType: STRING
    nullable: false
    role: record-state
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE,
      SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: valid_from_datetime
    sparkType: TIMESTAMP
    nullable: false
    primaryKey: true
    role: scd2-valid-from
    description: System-time start of the SCD2 window for this record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: valid_to_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: scd2-valid-to
    description: System-time end of the SCD2 window for this record version. Null indicates the current
      row.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: is_current_indicator
    sparkType: BOOLEAN
    nullable: false
    role: scd2-is-current
    description: True for exactly one row per logical key, indicating the current record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  scd2:
    enabled: true
    validFrom: valid_from_datetime
    validTo: valid_to_datetime
    isCurrent: is_current_indicator
    naturalKey:
    - geographic_location_uid
    deletionAware: true
    changeDetection:
      excludeFromHashing:
      - valid_from_datetime
      - valid_to_datetime
      - is_current_indicator
      - record_status_code
  recordState:
    enabled: true
    field: record_status_code
    activeValue: ACTIVE
    supersededValue: SUPERSEDED
    softDeletedValue: SOFT_DELETED
  appendOnly:
    enabled: false
    correctionIndicator: null
    correctsRefField: null
    businessTimeField: null
    partitionExpression: null
  qualityRules:
  - id: geographic_location_uid_required
    type: not_null
    column: geographic_location_uid
    severity: error
    sourceRule: geographic_location_uid_required
  - id: geographic_location_type_code_required
    type: not_null
    column: location_type_code
    severity: error
    sourceRule: geographic_location_type_code_required
  - id: geographic_location_country_code_required
    type: not_null
    column: country_code
    severity: error
    sourceRule: geographic_location_country_code_required
  - id: geographic_location_latitude_range_valid
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: Latitude number should be between -90
      and 90 when populated.'
    severity: warning
    sourceRule: geographic_location_latitude_range_valid
  - id: geographic_location_longitude_range_valid
    type: expression
    expression: 'TRUE  -- TODO: derive from contract description: Longitude number should be between -180
      and 180 when populated.'
    severity: warning
    sourceRule: geographic_location_longitude_range_valid
  - id: geographic_location_effective_date_not_after_expiration_date
    type: expression
    expression: effective_date IS NULL OR expiration_date IS NULL OR effective_date <= expiration_date
    severity: error
    sourceRule: geographic_location_effective_date_not_after_expiration_date
  - id: valid_from_datetime_required
    type: not_null
    column: valid_from_datetime
    severity: error
    sourceRule: valid_from_datetime_required
  - id: valid_window_consistent
    type: expression
    expression: valid_to_datetime IS NULL OR valid_to_datetime > valid_from_datetime
    severity: error
    sourceRule: valid_window_consistent
  - id: single_current_row_per_key
    type: unique
    keyColumns:
    - geographic_location_uid
    filter: is_current_indicator = true
    severity: error
    sourceRule: single_current_row_per_key
  - id: record_status_code_required
    type: not_null
    column: record_status_code
    severity: error
    sourceRule: record_status_code_required
  bronze:
    table: bronze.geographic_location_raw
    incrementalColumn: _ingested_at
    expectedColumns:
    - geographic_location_uid
    - source_system_code
    - source_natural_key
    - location_type_code
    - location_name
    - country_code
    - country_subdivision_code
    - county_name
    - city_name
    - postal_code
    - latitude_number
    - longitude_number
    - geocode_precision_code
    - effective_date
    - expiration_date
    - source_created_datetime
    - source_updated_datetime
    - record_status_code
    - valid_from_datetime
    - valid_to_datetime
    - is_current_indicator
