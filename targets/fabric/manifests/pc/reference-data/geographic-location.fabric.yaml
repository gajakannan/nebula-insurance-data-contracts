  name: GeographicLocation
  version: 0.3.2
  domain: property-and-casualty
  description: Canonical contract for geographic location reference data used across Property and Casualty
    insurance contexts.
  classificationProfile: CONFIDENTIAL
  subjectToHipaa: false
  contractKind: codeset
  subjectArea: reference-data
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - entity-boundaries
  - identifier-strategy
  - record-state
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
