manifestVersion: 1.0.0
contract:
  id: pc.occurrence
  name: Occurrence
  version: 0.1.2
  domain: property-and-casualty
  description: Canonical contract for an insured occurrence — the underlying event that gives rise to
    one or more Property and Casualty claims.
  classificationProfile: CONFIDENTIAL
  subjectToHipaa: false
  contractKind: entity
  subjectArea: claims
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - claims-modeling
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - null-semantics
  - record-state
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
fabric:
  lakehouse: nebula_pc_silver
  schema: silver_claims
  table:
    name: occurrence
    delta:
      tableProperties:
        delta.appendOnly: false
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - is_current_indicator
      zorderBy:
      - occurrence_uid
      vorder: true
  columns:
  - name: occurrence_uid
    sparkType: STRING
    nullable: false
    primaryKey: true
    role: identity
    description: Immutable system-generated GUID that uniquely identifies the canonical occurrence record
      across snapshots and source systems.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_system_code
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Identifier of the upstream system that produced or last asserted this record. Used for
      multi-source mastering and lineage.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.source-system-code
      codesetTable: silver_reference_data.source_system_code
      codesetField: code_value
  - name: source_natural_key
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical
      primary key.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: occurrence_number
    sparkType: STRING
    nullable: true
    role: business-key
    description: Business-facing number assigned to the occurrence, when the source system tracks one
      independently from claim numbers.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: occurrence_type_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Classification of the occurrence (collision, fire, theft, weather, liability event, etc.).
      References the OccurrenceTypeCode codeset.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.occurrence-type-code
      codesetTable: silver_reference_data.occurrence_type_code
      codesetField: code_value
  - name: occurrence_status_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Current lifecycle status of the occurrence record.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.occurrence-status-code
      codesetTable: silver_reference_data.occurrence_status_code
      codesetField: code_value
  - name: occurrence_date
    sparkType: DATE
    nullable: false
    role: data
    description: Date when the occurrence took place.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: occurrence_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: data
    description: Datetime when the occurrence took place when finer-grained timing is known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: catastrophe_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the catastrophe associated with the occurrence when applicable.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.catastrophe
      targetTable: silver_claims.catastrophe
      targetField: catastrophe_uid
  - name: location_uid
    sparkType: STRING
    nullable: true
    role: data
    description: Identifier (GUID reference) for the geographic location where the occurrence took place
      when known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.geographic-location
      codesetTable: silver_reference_data.geographic_location
      codesetField: geographic_location_uid
  - name: occurrence_description
    sparkType: STRING
    nullable: true
    role: data
    description: Source-neutral business description of the occurrence when additional context is needed.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: record_status_code
    sparkType: STRING
    nullable: false
    role: record-state
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE,
      SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.record-status-code
      codesetTable: silver_reference_data.record_status_code
      codesetField: code_value
  - name: valid_from_datetime
    sparkType: TIMESTAMP
    nullable: false
    primaryKey: true
    role: scd2-valid-from
    description: System-time start of the SCD2 window for this record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: valid_to_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: scd2-valid-to
    description: System-time end of the SCD2 window for this record version. Null indicates the current
      row.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: is_current_indicator
    sparkType: BOOLEAN
    nullable: false
    role: scd2-is-current
    description: True for exactly one row per logical key, indicating the current record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  scd2:
    enabled: true
    validFrom: valid_from_datetime
    validTo: valid_to_datetime
    isCurrent: is_current_indicator
    naturalKey:
    - occurrence_uid
    deletionAware: false
    changeDetection:
      excludeFromHashing:
      - valid_from_datetime
      - valid_to_datetime
      - is_current_indicator
      - record_status_code
  recordState:
    enabled: true
    field: record_status_code
    activeValue: ACTIVE
    supersededValue: SUPERSEDED
    softDeletedValue: SOFT_DELETED
  appendOnly:
    enabled: false
    correctionIndicator: null
    correctsRefField: null
    businessTimeField: null
    partitionExpression: null
  qualityRules:
  - id: occurrence_uid_required
    type: not_null
    column: occurrence_uid
    severity: error
    sourceRule: occurrence_uid_required
  - id: occurrence_type_code_required
    type: not_null
    column: occurrence_type_code
    severity: error
    sourceRule: occurrence_type_code_required
  - id: occurrence_date_required
    type: not_null
    column: occurrence_date
    severity: error
    sourceRule: occurrence_date_required
  - id: valid_from_datetime_required
    type: not_null
    column: valid_from_datetime
    severity: error
    sourceRule: valid_from_datetime_required
  - id: valid_window_consistent
    type: expression
    expression: valid_to_datetime IS NULL OR valid_to_datetime > valid_from_datetime
    severity: error
    sourceRule: valid_window_consistent
  - id: single_current_row_per_key
    type: unique
    keyColumns:
    - occurrence_uid
    filter: is_current_indicator = true
    severity: error
    sourceRule: single_current_row_per_key
  - id: record_status_code_required
    type: not_null
    column: record_status_code
    severity: error
    sourceRule: record_status_code_required
  - id: source_system_code_in_codeset
    type: accepted_values
    column: source_system_code
    codeset: pc.source-system-code
    codesetTable: silver_reference_data.source_system_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: occurrence_type_code_in_codeset
    type: accepted_values
    column: occurrence_type_code
    codeset: pc.occurrence-type-code
    codesetTable: silver_reference_data.occurrence_type_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: occurrence_status_code_in_codeset
    type: accepted_values
    column: occurrence_status_code
    codeset: pc.occurrence-status-code
    codesetTable: silver_reference_data.occurrence_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: location_uid_in_codeset
    type: accepted_values
    column: location_uid
    codeset: pc.geographic-location
    codesetTable: silver_reference_data.geographic_location
    codesetField: geographic_location_uid
    severity: error
    sourceRule: derived
  - id: record_status_code_in_codeset
    type: accepted_values
    column: record_status_code
    codeset: pc.record-status-code
    codesetTable: silver_reference_data.record_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  bronze:
    table: bronze.occurrence_raw
    incrementalColumn: _ingested_at
    expectedColumns:
    - occurrence_uid
    - source_system_code
    - source_natural_key
    - occurrence_number
    - occurrence_type_code
    - occurrence_status_code
    - occurrence_date
    - occurrence_datetime
    - catastrophe_uid
    - location_uid
    - occurrence_description
    - record_status_code
    - valid_from_datetime
    - valid_to_datetime
    - is_current_indicator
relationships:
- name: occurrence_to_occurrence_type
  description: Relates an occurrence to the OccurrenceTypeCode codeset.
  cardinality: many-to-one
  targetContract: pc.occurrence-type-code
  targetTable: silver_reference_data.occurrence_type_code
  sourceFields:
  - occurrence_type_code
  targetFields:
  - code_value
- name: occurrence_to_occurrence_status
  description: Relates an occurrence to the OccurrenceStatusCode codeset.
  cardinality: many-to-one
  targetContract: pc.occurrence-status-code
  targetTable: silver_reference_data.occurrence_status_code
  sourceFields:
  - occurrence_status_code
  targetFields:
  - code_value
- name: occurrence_to_catastrophe
  description: Relates an occurrence to the catastrophe with which it is associated when applicable.
  cardinality: many-to-one
  targetContract: pc.catastrophe
  targetTable: silver_claims.catastrophe
  sourceFields:
  - catastrophe_uid
  targetFields:
  - catastrophe_uid
- name: occurrence_to_location
  description: Relates an occurrence to the geographic location where it took place when known.
  cardinality: many-to-one
  targetContract: pc.geographic-location
  targetTable: silver_reference_data.geographic_location
  sourceFields:
  - location_uid
  targetFields:
  - geographic_location_uid
- name: occurrence_to_record_status
  description: Relates an occurrence to the RecordStatusCode codeset.
  cardinality: many-to-one
  targetContract: pc.record-status-code
  targetTable: silver_reference_data.record_status_code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
- name: occurrence_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  cardinality: many-to-one
  targetContract: pc.source-system-code
  targetTable: silver_reference_data.source_system_code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
