manifestVersion: 1.0.0
contract:
  id: pc.claim-document
  name: ClaimDocument
  version: 0.3.1
  domain: property-and-casualty
  description: Canonical contract for documents associated with a Property and Casualty claim. Stores
    document metadata only; document content is held in an external store.
  classificationProfile: CONFIDENTIAL
  subjectToHipaa: false
  contractKind: entity
  subjectArea: claims
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - claims-modeling
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - null-semantics
  - record-state
  - scd2-primary-key
  - separation-and-nesting
  - status-promotion
  - temporal-modeling
  - versioning-policy
fabric:
  lakehouse: nebula_pc_silver
  schema: silver_claims
  table:
    name: claim_document
    delta:
      tableProperties:
        delta.appendOnly: false
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - is_current_indicator
      zorderBy:
      - claim_document_uid
      vorder: true
  columns:
  - name: claim_document_uid
    sparkType: STRING
    nullable: false
    primaryKey: true
    role: identity
    description: Immutable system-generated GUID that uniquely identifies the canonical claim document
      record across snapshots and source systems.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_system_code
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Identifier of the upstream system that produced or last asserted this record. Used for
      multi-source mastering and lineage.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.source-system-code
      codesetTable: silver_reference_data.source_system_code
      codesetField: code_value
  - name: source_natural_key
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical
      primary key.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: claim_uid
    sparkType: STRING
    nullable: false
    role: foreign-key
    description: Identifier (GUID reference) for the claim associated with the document.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.claim
      targetTable: silver_claims.claim
      targetField: claim_uid
  - name: claim_feature_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the claim feature associated with the document when feature
      context is known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.claim-feature
      targetTable: silver_claims.claim_feature
      targetField: claim_feature_uid
  - name: document_type_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Classification of the document such as FNOL form, police report, medical record, photograph,
      repair estimate, demand letter, settlement agreement, or correspondence.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.document-type-code
      codesetTable: silver_reference_data.document_type_code
      codesetField: code_value
  - name: document_status_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Current lifecycle status of the document such as received, indexed, reviewed, redacted,
      or archived.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.document-status-code
      codesetTable: silver_reference_data.document_status_code
      codesetField: code_value
  - name: document_title
    sparkType: STRING
    nullable: true
    role: data
    description: Title or short label assigned to the document when known.
    classifications:
      sensitivity: CONFIDENTIAL
      regulatoryTags:
      - PII
    purview:
      sensitivityLabel: Confidential
  - name: external_storage_reference
    sparkType: STRING
    nullable: true
    role: data
    description: Opaque reference to the document content held in an external storage system. Treated
      as a pointer; the document body is not stored in this contract.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: capture_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: data
    description: Datetime when the document was captured, received, or registered.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: capture_party_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the party that captured or registered the document when
      known.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.party
      targetTable: silver_core.party
      targetField: party_uid
  - name: contains_phi_indicator
    sparkType: BOOLEAN
    nullable: true
    role: data
    description: Indicates whether the document is known to contain Protected Health Information. Used
      by downstream targets to apply HIPAA-compliant handling.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: record_status_code
    sparkType: STRING
    nullable: false
    role: record-state
    description: Warehouse-level state of the record. References the RecordStatusCode codeset.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.record-status-code
      codesetTable: silver_reference_data.record_status_code
      codesetField: code_value
  - name: valid_from_datetime
    sparkType: TIMESTAMP
    nullable: false
    primaryKey: true
    role: scd2-valid-from
    description: System-time start of the SCD2 window for this record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: valid_to_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: scd2-valid-to
    description: System-time end of the SCD2 window for this record version. Null indicates the current
      row.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: is_current_indicator
    sparkType: BOOLEAN
    nullable: false
    role: scd2-is-current
    description: True for exactly one row per logical key, indicating the current record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  scd2:
    enabled: true
    validFrom: valid_from_datetime
    validTo: valid_to_datetime
    isCurrent: is_current_indicator
    naturalKey:
    - claim_document_uid
    deletionAware: false
    changeDetection:
      excludeFromHashing:
      - valid_from_datetime
      - valid_to_datetime
      - is_current_indicator
      - record_status_code
  recordState:
    enabled: true
    field: record_status_code
    activeValue: ACTIVE
    supersededValue: SUPERSEDED
    softDeletedValue: SOFT_DELETED
  appendOnly:
    enabled: false
    correctionIndicator: null
    correctsRefField: null
    businessTimeField: null
    partitionExpression: null
  qualityRules:
  - id: claim_document_uid_required
    type: not_null
    column: claim_document_uid
    severity: error
    sourceRule: claim_document_uid_required
  - id: claim_document_claim_uid_required
    type: not_null
    column: claim_uid
    severity: error
    sourceRule: claim_document_claim_uid_required
  - id: claim_document_type_code_required
    type: not_null
    column: document_type_code
    severity: error
    sourceRule: claim_document_type_code_required
  - id: claim_document_status_code_required
    type: not_null
    column: document_status_code
    severity: error
    sourceRule: claim_document_status_code_required
  - id: valid_from_datetime_required
    type: not_null
    column: valid_from_datetime
    severity: error
    sourceRule: valid_from_datetime_required
  - id: valid_window_consistent
    type: expression
    expression: valid_to_datetime IS NULL OR valid_to_datetime > valid_from_datetime
    severity: error
    sourceRule: valid_window_consistent
  - id: single_current_row_per_key
    type: unique
    keyColumns:
    - claim_document_uid
    filter: is_current_indicator = true
    severity: error
    sourceRule: single_current_row_per_key
  - id: record_status_code_required
    type: not_null
    column: record_status_code
    severity: error
    sourceRule: record_status_code_required
  - id: source_system_code_in_codeset
    type: accepted_values
    column: source_system_code
    codeset: pc.source-system-code
    codesetTable: silver_reference_data.source_system_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: document_type_code_in_codeset
    type: accepted_values
    column: document_type_code
    codeset: pc.document-type-code
    codesetTable: silver_reference_data.document_type_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: document_status_code_in_codeset
    type: accepted_values
    column: document_status_code
    codeset: pc.document-status-code
    codesetTable: silver_reference_data.document_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: record_status_code_in_codeset
    type: accepted_values
    column: record_status_code
    codeset: pc.record-status-code
    codesetTable: silver_reference_data.record_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  bronze:
    table: bronze.claim_document_raw
    incrementalColumn: _ingested_at
    expectedColumns:
    - claim_document_uid
    - source_system_code
    - source_natural_key
    - claim_uid
    - claim_feature_uid
    - document_type_code
    - document_status_code
    - document_title
    - external_storage_reference
    - capture_datetime
    - capture_party_uid
    - contains_phi_indicator
    - record_status_code
    - valid_from_datetime
    - valid_to_datetime
    - is_current_indicator
relationships:
- name: claim_document_to_claim
  description: Relates a claim document to the claim associated with the document.
  cardinality: many-to-one
  targetContract: pc.claim
  targetTable: silver_claims.claim
  sourceFields:
  - claim_uid
  targetFields:
  - claim_uid
- name: claim_document_to_claim_feature
  description: Relates a claim document to the claim feature when feature context is known.
  cardinality: many-to-one
  targetContract: pc.claim-feature
  targetTable: silver_claims.claim_feature
  sourceFields:
  - claim_feature_uid
  targetFields:
  - claim_feature_uid
- name: claim_document_to_capture_party
  description: Relates a claim document to the party that captured or registered it when known.
  cardinality: many-to-one
  targetContract: pc.party
  targetTable: silver_core.party
  sourceFields:
  - capture_party_uid
  targetFields:
  - party_uid
- name: claim_document_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  cardinality: many-to-one
  targetContract: pc.source-system-code
  targetTable: silver_reference_data.source_system_code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
- name: claim_document_document_type_code_to_document_type_code
  description: Binds document_type_code to the canonical document-type-code codeset.
  cardinality: many-to-one
  targetContract: pc.document-type-code
  targetTable: silver_reference_data.document_type_code
  sourceFields:
  - document_type_code
  targetFields:
  - code_value
- name: claim_document_document_status_code_to_document_status_code
  description: Binds document_status_code to the canonical document-status-code codeset.
  cardinality: many-to-one
  targetContract: pc.document-status-code
  targetTable: silver_reference_data.document_status_code
  sourceFields:
  - document_status_code
  targetFields:
  - code_value
- name: claim_document_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  cardinality: many-to-one
  targetContract: pc.record-status-code
  targetTable: silver_reference_data.record_status_code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
