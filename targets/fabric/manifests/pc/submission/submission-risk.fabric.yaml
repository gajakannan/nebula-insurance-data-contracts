  - id: submission_risk_uid_required
    type: not_null
    column: submission_risk_uid
    severity: error
    sourceRule: submission_risk_uid_required
  - id: submission_risk_submission_uid_required
    type: not_null
    column: submission_uid
    severity: error
    sourceRule: submission_risk_submission_uid_required
  - id: submission_risk_type_code_required
    type: not_null
    column: risk_type_code
    severity: error
    sourceRule: submission_risk_type_code_required
  - id: submission_risk_status_code_required
    type: not_null
    column: risk_status_code
    severity: error
    sourceRule: submission_risk_status_code_required
  - id: submission_risk_effective_date_not_after_expiration_date
    type: expression
    expression: effective_date IS NULL OR expiration_date IS NULL OR effective_date <= expiration_date
    severity: error
    sourceRule: submission_risk_effective_date_not_after_expiration_date
  - id: valid_from_datetime_required
    type: not_null
    column: valid_from_datetime
    severity: error
    sourceRule: valid_from_datetime_required
  - id: valid_window_consistent
    type: expression
    expression: valid_to_datetime IS NULL OR valid_to_datetime > valid_from_datetime
    severity: error
    sourceRule: valid_window_consistent
  - id: single_current_row_per_key
    type: unique
    keyColumns:
    - submission_risk_uid
    filter: is_current_indicator = true
    severity: error
    sourceRule: single_current_row_per_key
  - id: record_status_code_required
    type: not_null
    column: record_status_code
    severity: error
    sourceRule: record_status_code_required
  - id: source_system_code_in_codeset
    type: accepted_values
    column: source_system_code
    codeset: pc.source-system-code
    codesetTable: silver_reference_data.source_system_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: geographic_location_uid_in_codeset
    type: accepted_values
    column: geographic_location_uid
    codeset: pc.geographic-location
    codesetTable: silver_reference_data.geographic_location
    codesetField: geographic_location_uid
    severity: error
    sourceRule: derived
  - id: record_status_code_in_codeset
    type: accepted_values
    column: record_status_code
    codeset: pc.record-status-code
    codesetTable: silver_reference_data.record_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
