      sensitivityLabel: Internal
  - name: risk_status_code
    sparkType: STRING
    nullable: false
    role: data
    description: Current lifecycle status of the submitted risk.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: exposure_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for an exposure associated with the submitted risk when exposure
      context is available.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.exposure
      targetTable: silver_exposure.exposure
      targetField: exposure_uid
  - name: insurable_object_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for an insurable object associated with the submitted risk
