      codesetField: geographic_location_uid
  - name: requested_coverage_indicator
    sparkType: BOOLEAN
    nullable: true
    role: data
    description: Indicates whether coverage was requested for the submitted risk.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: risk_description
    sparkType: STRING
    nullable: true
    role: data
    description: Source-neutral business description of the submitted risk when additional context is
