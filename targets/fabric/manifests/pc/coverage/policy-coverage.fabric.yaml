manifestVersion: 1.0.0
contract:
  id: pc.policy-coverage
  name: PolicyCoverage
  version: 0.4.2
  domain: property-and-casualty
  description: Canonical contract for coverage selected or applied within a Property and Casualty policy
    context.
  classificationProfile: INTERNAL
  subjectToHipaa: false
  contractKind: entity
  subjectArea: coverage
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - null-semantics
  - product-coverage-modeling
  - record-state
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
fabric:
  lakehouse: nebula_pc_silver
  schema: silver_coverage
  table:
    name: policy_coverage
    delta:
      tableProperties:
        delta.appendOnly: false
        delta.autoOptimize.optimizeWrite: true
        delta.autoOptimize.autoCompact: true
        delta.enableChangeDataFeed: true
      partitionedBy:
      - is_current_indicator
      zorderBy:
      - policy_coverage_uid
      vorder: true
  columns:
  - name: policy_coverage_uid
    sparkType: STRING
    nullable: false
    primaryKey: true
    role: identity
    description: Immutable system-generated GUID that uniquely identifies the canonical policy coverage
      record across snapshots and source systems.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_system_code
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Identifier of the upstream system that produced or last asserted this record. Used for
      multi-source mastering and lineage.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.source-system-code
      codesetTable: silver_reference_data.source_system_code
      codesetField: code_value
  - name: source_natural_key
    sparkType: STRING
    nullable: true
    role: source-attribution
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical
      primary key.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: policy_uid
    sparkType: STRING
    nullable: false
    role: foreign-key
    description: Identifier (GUID reference) for the policy where the coverage is selected or applied.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy
      targetTable: silver_policy.policy
      targetField: policy_uid
  - name: coverage_uid
    sparkType: STRING
    nullable: false
    role: foreign-key
    description: Identifier (GUID reference) for the reusable coverage definition selected or applied
      on the policy.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.coverage
      targetTable: silver_coverage.coverage
      targetField: coverage_uid
  - name: policy_term_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the policy term where the coverage applies when term
      detail is represented separately.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-term
      targetTable: silver_policy.policy_term
      targetField: policy_term_uid
  - name: exposure_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the exposure to which the coverage applies when coverage
      is exposure-specific.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.exposure
      targetTable: silver_exposure.exposure
      targetField: exposure_uid
  - name: policy_limit_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the policy limit detail associated with the coverage
      when represented separately.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-limit
      targetTable: silver_coverage.policy_limit
      targetField: policy_limit_uid
  - name: policy_deductible_uid
    sparkType: STRING
    nullable: true
    role: foreign-key
    description: Identifier (GUID reference) for the policy deductible detail associated with the coverage
      when represented separately.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    foreignKey:
      targetContract: pc.policy-deductible
      targetTable: silver_coverage.policy_deductible
      targetField: policy_deductible_uid
  - name: coverage_sequence_number
    sparkType: INT
    nullable: true
    role: business-key
    description: Ordering value used when multiple coverage records must be presented or processed in
      sequence within the policy context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: coverage_status_code
    sparkType: STRING
    nullable: false
    role: code-reference
    description: Current lifecycle status of the coverage within the policy context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.coverage-status-code
      codesetTable: silver_reference_data.coverage_status_code
      codesetField: code_value
  - name: coverage_level_code
    sparkType: STRING
    nullable: true
    role: code-reference
    description: Classification of the level where the coverage applies, such as policy, term, location,
      item, exposure, or coverage part.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.coverage-level-code
      codesetTable: silver_reference_data.coverage_level_code
      codesetField: code_value
  - name: coverage_basis_code
    sparkType: STRING
    nullable: true
    role: code-reference
    description: Classification of the basis used to apply the coverage within the policy context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.coverage-basis-code
      codesetTable: silver_reference_data.coverage_basis_code
      codesetField: code_value
  - name: selected_indicator
    sparkType: BOOLEAN
    nullable: true
    role: data
    description: Indicates whether the coverage was selected for the policy context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: mandatory_indicator
    sparkType: BOOLEAN
    nullable: true
    role: data
    description: Indicates whether the coverage is mandatory within the policy context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: effective_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the coverage becomes effective within the policy context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: expiration_date
    sparkType: DATE
    nullable: true
    role: data
    description: Date when the coverage stops being effective within the policy context.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_created_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: source-time
    description: Source-system timestamp asserting when this record was created. Captured for late-arriving-data
      analysis; distinct from the SCD2 system-time start in valid_from_datetime.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: source_updated_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: source-time
    description: Source-system timestamp asserting when this record was last updated. Captured for late-arriving-data
      analysis; distinct from the SCD2 system-time markers valid_from_datetime / valid_to_datetime.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: record_status_code
    sparkType: STRING
    nullable: false
    role: record-state
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE,
      SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
    codeReference:
      codeset: pc.record-status-code
      codesetTable: silver_reference_data.record_status_code
      codesetField: code_value
  - name: valid_from_datetime
    sparkType: TIMESTAMP
    nullable: false
    primaryKey: true
    role: scd2-valid-from
    description: System-time start of the SCD2 window for this record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: valid_to_datetime
    sparkType: TIMESTAMP
    nullable: true
    role: scd2-valid-to
    description: System-time end of the SCD2 window for this record version. Null indicates the current
      row.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  - name: is_current_indicator
    sparkType: BOOLEAN
    nullable: false
    role: scd2-is-current
    description: True for exactly one row per logical key, indicating the current record version.
    classifications:
      sensitivity: INTERNAL
    purview:
      sensitivityLabel: Internal
  scd2:
    enabled: true
    validFrom: valid_from_datetime
    validTo: valid_to_datetime
    isCurrent: is_current_indicator
    naturalKey:
    - policy_coverage_uid
    deletionAware: false
    changeDetection:
      excludeFromHashing:
      - valid_from_datetime
      - valid_to_datetime
      - is_current_indicator
      - record_status_code
  recordState:
    enabled: true
    field: record_status_code
    activeValue: ACTIVE
    supersededValue: SUPERSEDED
    softDeletedValue: SOFT_DELETED
  appendOnly:
    enabled: false
    correctionIndicator: null
    correctsRefField: null
    businessTimeField: null
    partitionExpression: null
  qualityRules:
  - id: policy_coverage_uid_required
    type: not_null
    column: policy_coverage_uid
    severity: error
    sourceRule: policy_coverage_uid_required
  - id: policy_coverage_policy_uid_required
    type: not_null
    column: policy_uid
    severity: error
    sourceRule: policy_coverage_policy_uid_required
  - id: policy_coverage_coverage_uid_required
    type: not_null
    column: coverage_uid
    severity: error
    sourceRule: policy_coverage_coverage_uid_required
  - id: policy_coverage_status_code_required
    type: not_null
    column: coverage_status_code
    severity: error
    sourceRule: policy_coverage_status_code_required
  - id: policy_coverage_effective_date_not_after_expiration_date
    type: expression
    expression: effective_date IS NULL OR expiration_date IS NULL OR effective_date <= expiration_date
    severity: error
    sourceRule: policy_coverage_effective_date_not_after_expiration_date
  - id: valid_from_datetime_required
    type: not_null
    column: valid_from_datetime
    severity: error
    sourceRule: valid_from_datetime_required
  - id: valid_window_consistent
    type: expression
    expression: valid_to_datetime IS NULL OR valid_to_datetime > valid_from_datetime
    severity: error
    sourceRule: valid_window_consistent
  - id: single_current_row_per_key
    type: unique
    keyColumns:
    - policy_coverage_uid
    filter: is_current_indicator = true
    severity: error
    sourceRule: single_current_row_per_key
  - id: record_status_code_required
    type: not_null
    column: record_status_code
    severity: error
    sourceRule: record_status_code_required
  - id: source_system_code_in_codeset
    type: accepted_values
    column: source_system_code
    codeset: pc.source-system-code
    codesetTable: silver_reference_data.source_system_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: coverage_status_code_in_codeset
    type: accepted_values
    column: coverage_status_code
    codeset: pc.coverage-status-code
    codesetTable: silver_reference_data.coverage_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: coverage_level_code_in_codeset
    type: accepted_values
    column: coverage_level_code
    codeset: pc.coverage-level-code
    codesetTable: silver_reference_data.coverage_level_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: coverage_basis_code_in_codeset
    type: accepted_values
    column: coverage_basis_code
    codeset: pc.coverage-basis-code
    codesetTable: silver_reference_data.coverage_basis_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  - id: record_status_code_in_codeset
    type: accepted_values
    column: record_status_code
    codeset: pc.record-status-code
    codesetTable: silver_reference_data.record_status_code
    codesetField: code_value
    severity: error
    sourceRule: derived
  bronze:
    table: bronze.policy_coverage_raw
    incrementalColumn: _ingested_at
    expectedColumns:
    - policy_coverage_uid
    - source_system_code
    - source_natural_key
    - policy_uid
    - coverage_uid
    - policy_term_uid
    - exposure_uid
    - policy_limit_uid
    - policy_deductible_uid
    - coverage_sequence_number
    - coverage_status_code
    - coverage_level_code
    - coverage_basis_code
    - selected_indicator
    - mandatory_indicator
    - effective_date
    - expiration_date
    - source_created_datetime
    - source_updated_datetime
    - record_status_code
    - valid_from_datetime
    - valid_to_datetime
    - is_current_indicator
