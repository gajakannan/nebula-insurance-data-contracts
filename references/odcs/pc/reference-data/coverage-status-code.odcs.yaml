apiVersion: v3.0.2
kind: DataContract
id: pc.coverage-status-code
name: CoverageStatusCode
version: 0.4.0
status: draft
description: Canonical codeset for the lifecycle status of a coverage within a policy context.
domain: property-and-casualty
schema:
- name: coverage_status_code
  physicalType: table
  description: Canonical CoverageStatusCode reference record. One row per allowed code value, versioned through SCD2 system time.
  properties:
  - name: coverage_status_code_uid
    businessName: CoverageStatusCode Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical CoverageStatusCode record across snapshots.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: code_value
    businessName: Code Value
    logicalType: string
    required: true
    description: Business-friendly code value referenced by entity contracts.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: code_label
    businessName: Code Label
    logicalType: string
    required: true
    description: Human-readable label for the code value.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: code_description
    businessName: Code Description
    logicalType: string
    required: false
    description: Extended description of the code value.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: external_standard_code
    businessName: External Standard Code
    logicalType: string
    required: false
    description: Code value as defined by an external standard (ACORD, NAIC, ISO, etc.) when a mapping is recorded.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: external_standard_name
    businessName: External Standard Name
    logicalType: string
    required: false
    description: Name of the external standard whose code is captured in external_standard_code.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: PUBLIC
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: PUBLIC
quality:
- rule: coverage_status_code_uid_required
  description: coverage_status_code_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: code_value_required
  description: code_value must be populated and unique among current rows.
  dimension: completeness
  severity: error
- rule: code_label_required
  description: code_label must be populated for every code value.
  dimension: completeness
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: coverage
  codesetContract: true
  classificationProfile: PUBLIC
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - record-state
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.1.0: Initial codeset contract generated per codeset-strategy ADR.'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR.'
  - '0.4.0: Canonical hardening C5 — lift classificationProfile to PUBLIC (C5.4 pure codeset); flip 4 field sensitivities to PUBLIC (C5.4 pure codeset).'
relationships: []
