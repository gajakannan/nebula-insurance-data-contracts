apiVersion: v3.0.2
kind: DataContract
id: pc.location-address
name: LocationAddress
version: 0.2.0
status: draft
description: Canonical contract for address reference data associated with a geographic location in Property and Casualty insurance.
domain: property-and-casualty
schema:
- name: location_address
  physicalType: table
  description: Canonical address record used to describe the addressable details of a geographic location.
  properties:
  - name: location_address_uid
    businessName: Location Address Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical location address record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags: &id001
        - PII
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: geographic_location_uid
    businessName: Geographic Location Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the geographic location described by the address.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: address_type_code
    businessName: Address Type Code
    logicalType: string
    required: false
    description: Classification of the address use or address type.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags: *id001
  - name: address_line_1
    businessName: Address Line 1
    logicalType: string
    required: false
    description: First address line for the location address.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags: *id001
  - name: address_line_2
    businessName: Address Line 2
    logicalType: string
    required: false
    description: Second address line for the location address.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags: *id001
  - name: city_name
    businessName: City Name
    logicalType: string
    required: false
    description: City, town, municipality, or comparable locality name for the address.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: country_subdivision_code
    businessName: Country Subdivision Code
    logicalType: string
    required: false
    description: State, province, territory, or other first-level country subdivision code for the address.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: postal_code
    businessName: Postal Code
    logicalType: string
    required: false
    description: Postal or ZIP code for the address.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: country_code
    businessName: Country Code
    logicalType: string
    required: true
    description: Country code for the address.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the address becomes effective for canonical use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the address stops being effective for canonical use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical location address record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical location address record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: location_address_to_geographic_location
  description: Relates a location address to the geographic location it describes.
  relationshipType: many-to-one
  targetContractId: pc.geographic-location
  sourceFields:
  - geographic_location_uid
  targetFields:
  - geographic_location_uid
quality:
- rule: location_address_uid_required
  description: location_address_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: location_address_geographic_location_uid_required
  description: Geographic location identifier must be populated for every location address.
  dimension: completeness
  severity: error
- rule: location_address_country_code_required
  description: Country code must be populated for every location address.
  dimension: completeness
  severity: error
- rule: location_address_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: reference-data
  classificationProfile: CONFIDENTIAL
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
