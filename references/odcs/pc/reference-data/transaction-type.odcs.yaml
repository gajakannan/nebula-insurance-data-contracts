apiVersion: v3.0.2
kind: DataContract
id: pc.transaction-type
name: TransactionType
version: 0.1.0
status: draft
description: Canonical contract for transaction type reference data used across Property and Casualty operational and financial activity.

domain: property-and-casualty

schema:
  - name: transaction_type
    physicalType: table
    description: Canonical transaction type reference record used to classify policy, claim, lifecycle, and financial transaction activity.
    properties:
      - name: transaction_type_id
        businessName: Transaction Type Identifier
        logicalType: string
        required: true
        primaryKey: true
        description: Stable identifier for the canonical transaction type record.
      - name: transaction_type_code
        businessName: Transaction Type Code
        logicalType: string
        required: true
        description: Business-facing code for the transaction type.
      - name: transaction_type_name
        businessName: Transaction Type Name
        logicalType: string
        required: true
        description: Business-facing name of the transaction type.
      - name: transaction_category_code
        businessName: Transaction Category Code
        logicalType: string
        required: false
        description: Higher-level grouping for related transaction types.
      - name: financial_transaction_indicator
        businessName: Financial Transaction Indicator
        logicalType: boolean
        required: false
        description: Indicates whether the transaction type is used for monetary activity.
      - name: lifecycle_event_indicator
        businessName: Lifecycle Event Indicator
        logicalType: boolean
        required: false
        description: Indicates whether the transaction type is used for lifecycle event activity.
      - name: transaction_type_description
        businessName: Transaction Type Description
        logicalType: string
        required: false
        description: Source-neutral business description of the transaction type.
      - name: status_code
        businessName: Status Code
        logicalType: string
        required: true
        description: Current lifecycle status of the transaction type reference record.
      - name: effective_date
        businessName: Effective Date
        logicalType: date
        required: false
        description: Date when the transaction type reference record becomes effective for canonical use.
      - name: expiration_date
        businessName: Expiration Date
        logicalType: date
        required: false
        description: Date when the transaction type reference record stops being effective for canonical use.
      - name: created_datetime
        businessName: Created Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical transaction type record was created.
      - name: updated_datetime
        businessName: Updated Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical transaction type record was last updated.

quality:
  - rule: transaction_type_id_required
    description: Transaction type identifier must be populated.
    dimension: completeness
    severity: error
  - rule: transaction_type_code_required
    description: Transaction type code must be populated.
    dimension: completeness
    severity: error
  - rule: transaction_type_name_required
    description: Transaction type name must be populated.
    dimension: completeness
    severity: error
  - rule: transaction_type_status_code_required
    description: Status code must be populated for every transaction type reference record.
    dimension: completeness
    severity: error
  - rule: transaction_type_effective_date_not_after_expiration_date
    description: Effective date must not be later than expiration date when both dates are populated.
    dimension: consistency
    severity: error

customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: reference-data
