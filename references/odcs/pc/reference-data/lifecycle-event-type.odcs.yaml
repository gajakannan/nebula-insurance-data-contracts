apiVersion: v3.0.2
kind: DataContract
id: pc.lifecycle-event-type
name: LifecycleEventType
version: 0.4.0
status: draft
description: Canonical contract for lifecycle event type reference data used across Property and Casualty business lifecycles.
domain: property-and-casualty
schema:
- name: lifecycle_event_type
  physicalType: table
  description: Canonical lifecycle event type reference record used to classify meaningful business state changes.
  properties:
  - name: lifecycle_event_type_uid
    businessName: Lifecycle Event Type Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical lifecycle event type record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: code_value
    businessName: Code Value
    logicalType: string
    required: true
    description: Business-friendly code value referenced by entity contracts.
    customProperties:
      classifications:
        sensitivity: PUBLIC
  - name: code_label
    businessName: Code Label
    logicalType: string
    required: true
    description: Human-readable label for the code value.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: code_description
    businessName: Code Description
    logicalType: string
    required: false
    description: Extended description of the code value.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: external_standard_code
    businessName: External Standard Code
    logicalType: string
    required: false
    description: Code value as defined by an external standard (ACORD, NAIC, ISO, etc.) when a mapping is recorded.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: external_standard_name
    businessName: External Standard Name
    logicalType: string
    required: false
    description: Name of the external standard whose code is captured in external_standard_code.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: lifecycle_subject_code
    businessName: Lifecycle Subject Code
    logicalType: string
    required: true
    description: Classification of the business subject to which the lifecycle event type applies.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: resulting_lifecycle_status_uid
    businessName: Resulting Lifecycle Status Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the lifecycle status that commonly results from this event type when applicable.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_type_uid
    businessName: Transaction Type Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the transaction type associated with this lifecycle event type when applicable.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: lifecycle_event_type_status_code
    businessName: Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the lifecycle event type reference record.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the lifecycle event type reference record becomes effective for canonical use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the lifecycle event type reference record stops being effective for canonical use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical lifecycle event type record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical lifecycle event type record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: lifecycle_event_type_to_resulting_lifecycle_status
  description: Relates a lifecycle event type to the lifecycle status that commonly results from it when applicable.
  relationshipType: many-to-one
  targetContractId: pc.lifecycle-status
  sourceFields:
  - resulting_lifecycle_status_uid
  targetFields:
  - lifecycle_status_uid
- name: lifecycle_event_type_to_transaction_type
  description: Relates a lifecycle event type to the transaction type associated with it when applicable.
  relationshipType: many-to-one
  targetContractId: pc.transaction-type
  sourceFields:
  - transaction_type_uid
  targetFields:
  - transaction_type_uid
quality:
- rule: lifecycle_event_type_uid_required
  description: lifecycle_event_type_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: lifecycle_event_type_subject_code_required
  description: Lifecycle subject code must be populated.
  dimension: completeness
  severity: error
- rule: lifecycle_event_type_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
- rule: code_value_required
  description: code_value must be populated and unique among current rows.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: reference-data
  classificationProfile: RESTRICTED
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR; re-tag over-classified field(s) to INTERNAL: resulting_lifecycle_status_uid.'
  - '0.4.0: Canonical hardening C5 — rename status_code field(s): status_code → lifecycle_event_type_status_code; lift code_value sensitivity to PUBLIC (C5.7).'
