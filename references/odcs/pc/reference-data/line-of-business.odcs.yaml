apiVersion: v3.0.2
kind: DataContract
id: pc.line-of-business
name: LineOfBusiness
version: 0.2.0
status: draft
description: Canonical contract for Property and Casualty line of business reference data.
domain: property-and-casualty
schema:
- name: line_of_business
  physicalType: table
  description: Canonical line of business reference record used to classify policies, coverages, products, exposures, claims, and financial transactions.
  properties:
  - name: line_of_business_uid
    businessName: Line Of Business Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical line of business record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: code_value
    businessName: Code Value
    logicalType: string
    required: true
    description: Business-friendly code value referenced by entity contracts.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: code_label
    businessName: Code Label
    logicalType: string
    required: true
    description: Human-readable label for the code value.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: code_description
    businessName: Code Description
    logicalType: string
    required: false
    description: Extended description of the code value.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: external_standard_code
    businessName: External Standard Code
    logicalType: string
    required: false
    description: Code value as defined by an external standard (ACORD, NAIC, ISO, etc.) when a mapping is recorded.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: external_standard_name
    businessName: External Standard Name
    logicalType: string
    required: false
    description: Name of the external standard whose code is captured in external_standard_code.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: business_segment_code
    businessName: Business Segment Code
    logicalType: string
    required: false
    description: Higher-level business segment classification for the line of business.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: parent_line_of_business_uid
    businessName: Parent Line Of Business Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for a parent line of business when a hierarchy is used.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: status_code
    businessName: Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the line of business reference record.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the line of business reference record becomes effective for canonical use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the line of business reference record stops being effective for canonical use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical line of business record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical line of business record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: line_of_business_to_parent_line_of_business
  description: Relates a line of business to a parent line of business when a hierarchy is used.
  relationshipType: many-to-one
  targetContractId: pc.line-of-business
  sourceFields:
  - parent_line_of_business_uid
  targetFields:
  - line_of_business_uid
quality:
- rule: line_of_business_uid_required
  description: line_of_business_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: line_of_business_status_code_required
  description: Status code must be populated for every line of business reference record.
  dimension: completeness
  severity: error
- rule: line_of_business_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
- rule: code_value_required
  description: code_value must be populated and unique among current rows.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: reference-data
  classificationProfile: INTERNAL
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
