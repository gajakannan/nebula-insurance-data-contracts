apiVersion: v3.0.2
kind: DataContract
id: pc.policy-party-role
name: PolicyPartyRole
version: 0.1.0
status: draft
description: Canonical contract for a party participating in a Property and Casualty policy context.

domain: property-and-casualty

schema:
  - name: policy_party_role
    physicalType: table
    description: Canonical policy party role record that separates reusable party identity from policy-specific participation.
    properties:
      - name: policy_party_role_id
        businessName: Policy Party Role Identifier
        logicalType: string
        required: true
        primaryKey: true
        description: Stable identifier for the canonical policy party role record.
      - name: policy_id
        businessName: Policy Identifier
        logicalType: string
        required: true
        description: Identifier for the policy where the party participates.
      - name: policy_term_id
        businessName: Policy Term Identifier
        logicalType: string
        required: false
        description: Identifier for the policy term where the party role applies when the role is term-specific.
      - name: party_id
        businessName: Party Identifier
        logicalType: string
        required: true
        description: Identifier for the party participating in the policy role.
      - name: role_type_code
        businessName: Role Type Code
        logicalType: string
        required: true
        description: Classification of the role the party plays in the policy context.
      - name: role_status_code
        businessName: Role Status Code
        logicalType: string
        required: true
        description: Current lifecycle status of the party role within the policy context.
      - name: primary_role_indicator
        businessName: Primary Role Indicator
        logicalType: boolean
        required: false
        description: Indicates whether this party role is the primary role of its type within the policy context.
      - name: effective_date
        businessName: Effective Date
        logicalType: date
        required: false
        description: Date when the party role becomes effective in the policy context.
      - name: expiration_date
        businessName: Expiration Date
        logicalType: date
        required: false
        description: Date when the party role stops being effective in the policy context.
      - name: created_datetime
        businessName: Created Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical policy party role record was created.
      - name: updated_datetime
        businessName: Updated Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical policy party role record was last updated.

relationships:
  - name: policy_party_role_to_policy
    description: Relates a policy party role to the policy where the party participates.
    relationshipType: many-to-one
    targetContractId: pc.policy
    sourceFields:
      - policy_id
    targetFields:
      - policy_id
  - name: policy_party_role_to_policy_term
    description: Relates a policy party role to the policy term where the role applies when the role is term-specific.
    relationshipType: many-to-one
    targetContractId: pc.policy-term
    sourceFields:
      - policy_term_id
    targetFields:
      - policy_term_id
  - name: policy_party_role_to_party
    description: Relates a policy party role to the reusable party identity.
    relationshipType: many-to-one
    targetContractId: pc.party
    sourceFields:
      - party_id
    targetFields:
      - party_id

quality:
  - rule: policy_party_role_id_required
    description: Policy party role identifier must be populated.
    dimension: completeness
    severity: error
  - rule: policy_party_role_policy_id_required
    description: Policy identifier must be populated for every policy party role.
    dimension: completeness
    severity: error
  - rule: policy_party_role_party_id_required
    description: Party identifier must be populated for every policy party role.
    dimension: completeness
    severity: error
  - rule: policy_party_role_type_code_required
    description: Role type code must be populated for every policy party role.
    dimension: completeness
    severity: error
  - rule: policy_party_role_status_code_required
    description: Role status code must be populated for every policy party role.
    dimension: completeness
    severity: error
  - rule: policy_party_role_effective_date_not_after_expiration_date
    description: Effective date must not be later than expiration date when both dates are populated.
    dimension: consistency
    severity: error

customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: policy
  supportsPartyRolePattern: true
  supportsPolicyLifecyclePattern: true
