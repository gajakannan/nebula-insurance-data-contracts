apiVersion: v3.0.2
kind: DataContract
id: pc.policy-party-role
name: PolicyPartyRole
version: 0.4.1
status: draft
description: Canonical contract for a party participating in a Property and Casualty policy context.
domain: property-and-casualty
schema:
- name: policy_party_role
  physicalType: table
  description: Canonical policy party role record that separates reusable party identity from policy-specific participation.
  properties:
  - name: policy_party_role_uid
    businessName: Policy Party Role Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical policy party role record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_uid
    businessName: Policy Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the policy where the party participates.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_term_uid
    businessName: Policy Term Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy term where the party role applies when the role is term-specific.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: party_uid
    businessName: Party Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the party participating in the policy role.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: role_type_code
    businessName: Role Type Code
    logicalType: string
    required: true
    description: Classification of the role the party plays in the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: role_status_code
    businessName: Role Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the party role within the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: primary_role_indicator
    businessName: Primary Role Indicator
    logicalType: boolean
    required: false
    description: Indicates whether this party role is the primary role of its type within the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the party role becomes effective in the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the party role stops being effective in the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_created_datetime
    businessName: Source Created Datetime
    logicalType: datetime
    required: false
    description: Source-system timestamp asserting when this record was created. Captured for late-arriving-data analysis; distinct from the SCD2 system-time start in valid_from_datetime.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_updated_datetime
    businessName: Source Updated Datetime
    logicalType: datetime
    required: false
    description: Source-system timestamp asserting when this record was last updated. Captured for late-arriving-data analysis; distinct from the SCD2 system-time markers valid_from_datetime / valid_to_datetime.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: policy_party_role_to_policy
  description: Relates a policy party role to the policy where the party participates.
  relationshipType: many-to-one
  targetContractId: pc.policy
  sourceFields:
  - policy_uid
  targetFields:
  - policy_uid
- name: policy_party_role_to_policy_term
  description: Relates a policy party role to the policy term where the role applies when the role is term-specific.
  relationshipType: many-to-one
  targetContractId: pc.policy-term
  sourceFields:
  - policy_term_uid
  targetFields:
  - policy_term_uid
- name: policy_party_role_to_party
  description: Relates a policy party role to the reusable party identity.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - party_uid
  targetFields:
  - party_uid
- name: policy_party_role_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
- name: policy_party_role_role_type_code_to_party_role_type_code
  description: Binds role_type_code to the canonical party-role-type-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.party-role-type-code
  sourceFields:
  - role_type_code
  targetFields:
  - code_value
- name: policy_party_role_role_status_code_to_role_status_code
  description: Binds role_status_code to the canonical role-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.role-status-code
  sourceFields:
  - role_status_code
  targetFields:
  - code_value
- name: policy_party_role_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
quality:
- rule: policy_party_role_uid_required
  description: policy_party_role_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: policy_party_role_policy_uid_required
  description: Policy identifier must be populated for every policy party role.
  dimension: completeness
  severity: error
- rule: policy_party_role_party_uid_required
  description: Party identifier must be populated for every policy party role.
  dimension: completeness
  severity: error
- rule: policy_party_role_type_code_required
  description: Role type code must be populated for every policy party role.
  dimension: completeness
  severity: error
- rule: policy_party_role_status_code_required
  description: Role status code must be populated for every policy party role.
  dimension: completeness
  severity: error
- rule: policy_party_role_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: policy
  supportsPartyRolePattern: true
  supportsPolicyLifecyclePattern: true
  classificationProfile: INTERNAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - null-semantics
  - record-state
  - role-modeling
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR.'
  - '0.4.0: Canonical hardening C5 — bind 4 *_code field(s) to codeset(s) (C5.2).'
  - '0.4.1: Canonical hardening C7 — rename created_datetime → source_created_datetime; updated_datetime → source_updated_datetime — capture source-system time, distinct from SCD2 system time (C7.4).'
