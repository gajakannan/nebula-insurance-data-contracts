apiVersion: v3.0.2
kind: DataContract
id: pc.policy-transaction
name: PolicyTransaction
version: 0.1.0
status: draft
description: Canonical contract for transaction-level policy activity in Property and Casualty insurance.

domain: property-and-casualty

schema:
  - name: policy_transaction
    physicalType: table
    description: Canonical policy transaction record for policy changes that have transaction-level business meaning.
    properties:
      - name: policy_transaction_id
        businessName: Policy Transaction Identifier
        logicalType: string
        required: true
        primaryKey: true
        description: Stable identifier for the canonical policy transaction record.
      - name: policy_id
        businessName: Policy Identifier
        logicalType: string
        required: true
        description: Identifier for the policy associated with the transaction.
      - name: policy_term_id
        businessName: Policy Term Identifier
        logicalType: string
        required: false
        description: Identifier for the policy term associated with the transaction when term context is known.
      - name: policy_lifecycle_event_id
        businessName: Policy Lifecycle Event Identifier
        logicalType: string
        required: false
        description: Identifier for the policy lifecycle event associated with the transaction when event context is known.
      - name: transaction_type_id
        businessName: Transaction Type Identifier
        logicalType: string
        required: false
        description: Identifier for the transaction type when reference data is available.
      - name: transaction_type_code
        businessName: Transaction Type Code
        logicalType: string
        required: true
        description: Business-facing code for the policy transaction type.
      - name: transaction_status_code
        businessName: Transaction Status Code
        logicalType: string
        required: true
        description: Current lifecycle status of the policy transaction.
      - name: transaction_effective_date
        businessName: Transaction Effective Date
        logicalType: date
        required: true
        description: Date when the policy transaction takes business effect.
      - name: transaction_processed_datetime
        businessName: Transaction Processed Datetime
        logicalType: datetime
        required: false
        description: Datetime when the policy transaction was processed or recorded.
      - name: transaction_sequence_number
        businessName: Transaction Sequence Number
        logicalType: integer
        required: false
        description: Sequence number used to order policy transactions within a policy or term context.
      - name: requested_by_party_id
        businessName: Requested By Party Identifier
        logicalType: string
        required: false
        description: Identifier for the party that requested the policy transaction when known.
      - name: processed_by_party_id
        businessName: Processed By Party Identifier
        logicalType: string
        required: false
        description: Identifier for the party that processed or is accountable for the policy transaction when known.
      - name: premium_change_amount
        businessName: Premium Change Amount
        logicalType: decimal
        required: false
        description: Monetary premium change associated with the policy transaction when available.
      - name: premium_currency_code
        businessName: Premium Currency Code
        logicalType: string
        required: false
        description: Currency code for the premium change amount.
      - name: transaction_description
        businessName: Transaction Description
        logicalType: string
        required: false
        description: Source-neutral business description of the policy transaction when additional context is needed.
      - name: created_datetime
        businessName: Created Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical policy transaction record was created.
      - name: updated_datetime
        businessName: Updated Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical policy transaction record was last updated.

relationships:
  - name: policy_transaction_to_policy
    description: Relates a policy transaction to the policy associated with the transaction.
    relationshipType: many-to-one
    targetContractId: pc.policy
    sourceFields:
      - policy_id
    targetFields:
      - policy_id
  - name: policy_transaction_to_policy_term
    description: Relates a policy transaction to the policy term associated with the transaction when term context is known.
    relationshipType: many-to-one
    targetContractId: pc.policy-term
    sourceFields:
      - policy_term_id
    targetFields:
      - policy_term_id
  - name: policy_transaction_to_policy_lifecycle_event
    description: Relates a policy transaction to the policy lifecycle event associated with the transaction when event context is known.
    relationshipType: many-to-one
    targetContractId: pc.policy-lifecycle-event
    sourceFields:
      - policy_lifecycle_event_id
    targetFields:
      - policy_lifecycle_event_id
  - name: policy_transaction_to_transaction_type
    description: Relates a policy transaction to transaction type reference data when available.
    relationshipType: many-to-one
    targetContractId: pc.transaction-type
    sourceFields:
      - transaction_type_id
    targetFields:
      - transaction_type_id
  - name: policy_transaction_to_requested_by_party
    description: Relates a policy transaction to the party that requested it when known.
    relationshipType: many-to-one
    targetContractId: pc.party
    sourceFields:
      - requested_by_party_id
    targetFields:
      - party_id
  - name: policy_transaction_to_processed_by_party
    description: Relates a policy transaction to the party that processed or is accountable for it when known.
    relationshipType: many-to-one
    targetContractId: pc.party
    sourceFields:
      - processed_by_party_id
    targetFields:
      - party_id

quality:
  - rule: policy_transaction_id_required
    description: Policy transaction identifier must be populated.
    dimension: completeness
    severity: error
  - rule: policy_transaction_policy_id_required
    description: Policy identifier must be populated for every policy transaction.
    dimension: completeness
    severity: error
  - rule: policy_transaction_type_code_required
    description: Transaction type code must be populated for every policy transaction.
    dimension: completeness
    severity: error
  - rule: policy_transaction_status_code_required
    description: Transaction status code must be populated for every policy transaction.
    dimension: completeness
    severity: error
  - rule: policy_transaction_effective_date_required
    description: Transaction effective date must be populated for every policy transaction.
    dimension: completeness
    severity: error
  - rule: policy_transaction_premium_change_has_currency
    description: Premium currency code should be populated when premium change amount is populated.
    dimension: completeness
    severity: warning

customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: policy
  supportsPolicyLifecyclePattern: true
