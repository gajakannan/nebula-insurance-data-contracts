apiVersion: v3.0.2
kind: DataContract
id: pc.policy-transaction
name: PolicyTransaction
version: 0.4.1
status: proposed
description: Canonical contract for transaction-level policy activity in Property and Casualty insurance.
domain: property-and-casualty
schema:
- name: policy_transaction
  physicalType: table
  description: Canonical policy transaction record for policy changes that have transaction-level business meaning.
  properties:
  - name: policy_transaction_uid
    businessName: Policy Transaction Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical policy transaction record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_uid
    businessName: Policy Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the policy associated with the transaction.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_term_uid
    businessName: Policy Term Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy term associated with the transaction when term context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_lifecycle_event_uid
    businessName: Policy Lifecycle Event Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy lifecycle event associated with the transaction when event context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_type_code
    businessName: Transaction Type Code
    logicalType: string
    required: true
    description: Business-facing code for the policy transaction type.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_effective_date
    businessName: Transaction Effective Date
    logicalType: date
    required: true
    description: Date when the policy transaction takes business effect.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_processed_datetime
    businessName: Transaction Processed Datetime
    logicalType: datetime
    required: false
    description: Datetime when the policy transaction was processed or recorded.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_sequence_number
    businessName: Transaction Sequence Number
    logicalType: integer
    required: false
    description: Sequence number used to order policy transactions within a policy or term context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: requested_by_party_uid
    businessName: Requested By Party Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the party that requested the policy transaction when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: processed_by_party_uid
    businessName: Processed By Party Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the party that processed or is accountable for the policy transaction when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: premium_change_amount
    businessName: Premium Change Amount
    logicalType: decimal
    required: false
    description: Monetary premium change associated with the policy transaction when available.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - FINANCIAL
  - name: premium_change_currency_code
    businessName: Premium Change Currency Code
    logicalType: string
    required: false
    description: Currency code for the premium change amount.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_description
    businessName: Transaction Description
    logicalType: string
    required: false
    description: Source-neutral business description of the policy transaction when additional context is needed.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: correction_indicator
    businessName: Correction Indicator
    logicalType: boolean
    required: true
    description: True when this row corrects a previously emitted row. False for original (uncorrected) rows.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: corrects_policy_transaction_uid
    businessName: Corrects Record Identifier
    logicalType: string
    required: false
    description: Reference to the prior row that this row corrects. Populated only when correction_indicator is true.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: policy_transaction_to_policy
  description: Relates a policy transaction to the policy associated with the transaction.
  relationshipType: many-to-one
  targetContractId: pc.policy
  sourceFields:
  - policy_uid
  targetFields:
  - policy_uid
- name: policy_transaction_to_policy_term
  description: Relates a policy transaction to the policy term associated with the transaction when term context is known.
  relationshipType: many-to-one
  targetContractId: pc.policy-term
  sourceFields:
  - policy_term_uid
  targetFields:
  - policy_term_uid
- name: policy_transaction_to_policy_lifecycle_event
  description: Relates a policy transaction to the policy lifecycle event associated with the transaction when event context is known.
  relationshipType: many-to-one
  targetContractId: pc.policy-lifecycle-event
  sourceFields:
  - policy_lifecycle_event_uid
  targetFields:
  - policy_lifecycle_event_uid
- name: policy_transaction_to_transaction_type
  description: Relates a policy transaction to transaction type reference data when available.
  relationshipType: many-to-one
  targetContractId: pc.transaction-type
  sourceFields:
  - transaction_type_code
  targetFields:
  - code_value
- name: policy_transaction_to_requested_by_party
  description: Relates a policy transaction to the party that requested it when known.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - requested_by_party_uid
  targetFields:
  - party_uid
- name: policy_transaction_to_processed_by_party
  description: Relates a policy transaction to the party that processed or is accountable for it when known.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - processed_by_party_uid
  targetFields:
  - party_uid
- name: policy_transaction_premium_change_currency_code_to_currency_code
  description: Binds premium_change_currency_code to the canonical currency-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.currency-code
  sourceFields:
  - premium_change_currency_code
  targetFields:
  - code_value
quality:
- rule: policy_transaction_uid_required
  description: policy_transaction_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: policy_transaction_policy_uid_required
  description: Policy identifier must be populated for every policy transaction.
  dimension: completeness
  severity: error
- rule: policy_transaction_type_code_required
  description: Transaction type code must be populated for every policy transaction.
  dimension: completeness
  severity: error
- rule: policy_transaction_effective_date_required
  description: Transaction effective date must be populated for every policy transaction.
  dimension: completeness
  severity: error
- rule: policy_transaction_premium_change_has_currency
  description: Premium currency code should be populated when premium change amount is populated.
  dimension: completeness
  severity: warning
- rule: correction_indicator_required
  description: correction_indicator must be populated for every event or transaction row.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: policy
  supportsPolicyLifecyclePattern: true
  classificationProfile: CONFIDENTIAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - currency-convention
  - data-classification
  - event-and-transaction
  - financial-modeling
  - identifier-strategy
  - policy-lifecycle-modeling
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — drop created_datetime, updated_datetime (append-only per temporal-modeling ADR); drop mutable transaction_status_code (status belongs on lifecycle events); rename premium_currency_code
    → premium_change_currency_code for currency pairing on premium_change_amount; re-tag narrative free-text field(s) to CONFIDENTIAL + PII: transaction_description; drop redundant transaction_type_uid
    (keep transaction_type_code).'
  - '0.4.0: Canonical hardening C5 — bind 1 *_code field(s) to codeset(s) (C5.2).'
  - '0.4.1: Promoted from draft to proposed (M10.6, 2026-05-08).'
