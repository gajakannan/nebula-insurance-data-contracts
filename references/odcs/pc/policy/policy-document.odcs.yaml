apiVersion: v3.0.2
kind: DataContract
id: pc.policy-document
name: PolicyDocument
version: 0.4.1
status: draft
description: Canonical contract for documents associated with a Property and Casualty policy.
domain: property-and-casualty
schema:
- name: policy_document
  physicalType: table
  description: Canonical policy document record that captures document identity, type, status, timing, and policy relationship context.
  properties:
  - name: policy_document_uid
    businessName: Policy Document Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical policy document record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_uid
    businessName: Policy Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the policy associated with the document.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_term_uid
    businessName: Policy Term Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy term associated with the document when term context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_transaction_uid
    businessName: Policy Transaction Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy transaction associated with the document when transaction context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: document_type_code
    businessName: Document Type Code
    logicalType: string
    required: true
    description: Classification of the policy document type.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: document_status_code
    businessName: Document Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the policy document.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: document_title
    businessName: Document Title
    logicalType: string
    required: false
    description: Business-facing title for the policy document.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: external_storage_reference
    businessName: External Storage Reference
    logicalType: string
    required: false
    description: Source-neutral reference used to locate or reconcile the policy document in its system of record (storage URI, document-management identifier, etc.).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: capture_datetime
    businessName: Capture Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical policy document record was captured into the warehouse. Distinct from issued / received which carry business semantics.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: issued_datetime
    businessName: Issued Datetime
    logicalType: datetime
    required: false
    description: Datetime when the policy document was issued or generated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: received_datetime
    businessName: Received Datetime
    logicalType: datetime
    required: false
    description: Datetime when the policy document was received when applicable.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: contains_phi_indicator
    businessName: Contains PHI Indicator
    logicalType: boolean
    required: false
    description: Indicates whether the document contains protected health information; informs downstream masking and access controls.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the policy document becomes effective for business use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the policy document stops being effective for business use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical policy document record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical policy document record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: policy_document_to_policy
  description: Relates a policy document to the policy associated with the document.
  relationshipType: many-to-one
  targetContractId: pc.policy
  sourceFields:
  - policy_uid
  targetFields:
  - policy_uid
- name: policy_document_to_policy_term
  description: Relates a policy document to the policy term associated with the document when term context is known.
  relationshipType: many-to-one
  targetContractId: pc.policy-term
  sourceFields:
  - policy_term_uid
  targetFields:
  - policy_term_uid
- name: policy_document_to_policy_transaction
  description: Relates a policy document to the policy transaction associated with the document when transaction context is known.
  relationshipType: many-to-one
  targetContractId: pc.policy-transaction
  sourceFields:
  - policy_transaction_uid
  targetFields:
  - policy_transaction_uid
- name: policy_document_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
- name: policy_document_document_type_code_to_document_type_code
  description: Binds document_type_code to the canonical document-type-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.document-type-code
  sourceFields:
  - document_type_code
  targetFields:
  - code_value
- name: policy_document_document_status_code_to_document_status_code
  description: Binds document_status_code to the canonical document-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.document-status-code
  sourceFields:
  - document_status_code
  targetFields:
  - code_value
- name: policy_document_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
quality:
- rule: policy_document_uid_required
  description: policy_document_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: policy_document_policy_uid_required
  description: Policy identifier must be populated for every policy document.
  dimension: completeness
  severity: error
- rule: policy_document_type_code_required
  description: Document type code must be populated for every policy document.
  dimension: completeness
  severity: error
- rule: policy_document_status_code_required
  description: Document status code must be populated for every policy document.
  dimension: completeness
  severity: error
- rule: policy_document_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: policy
  supportsPolicyLifecyclePattern: true
  classificationProfile: INTERNAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - null-semantics
  - record-state
  - scd2-primary-key
  - separation-and-nesting
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR.'
  - '0.4.0: Canonical hardening C4 — align document-contract field naming on the claim-document shape (C4.9): rename document_name → document_title, document_reference → external_storage_reference; add
    capture_datetime alongside existing issued/received_datetime; add contains_phi_indicator.'
  - '0.4.1: Canonical hardening C5 — bind 4 *_code field(s) to codeset(s) (C5.2).'
