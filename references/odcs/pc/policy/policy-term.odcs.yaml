apiVersion: v3.0.2
kind: DataContract
id: pc.policy-term
name: PolicyTerm
version: 0.1.0
status: draft
description: Canonical contract for a term period associated with a Property and Casualty policy.

domain: property-and-casualty

schema:
  - name: policy_term
    physicalType: table
    description: Canonical policy term record that represents an effective period within a durable policy history.
    properties:
      - name: policy_term_id
        businessName: Policy Term Identifier
        logicalType: string
        required: true
        primaryKey: true
        description: Stable identifier for the canonical policy term record.
      - name: policy_id
        businessName: Policy Identifier
        logicalType: string
        required: true
        description: Identifier for the policy associated with the term.
      - name: policy_term_number
        businessName: Policy Term Number
        logicalType: integer
        required: false
        description: Sequence number or ordinal value for the policy term within the durable policy history.
      - name: term_status_code
        businessName: Term Status Code
        logicalType: string
        required: true
        description: Current lifecycle status of the policy term.
      - name: term_effective_date
        businessName: Term Effective Date
        logicalType: date
        required: true
        description: Date when the policy term becomes effective.
      - name: term_expiration_date
        businessName: Term Expiration Date
        logicalType: date
        required: true
        description: Date when the policy term expires.
      - name: cancellation_date
        businessName: Cancellation Date
        logicalType: date
        required: false
        description: Date when the policy term is cancelled when cancellation applies.
      - name: renewal_indicator
        businessName: Renewal Indicator
        logicalType: boolean
        required: false
        description: Indicates whether the policy term represents a renewal term.
      - name: annualized_premium_amount
        businessName: Annualized Premium Amount
        logicalType: decimal
        required: false
        description: Annualized premium amount associated with the policy term when available.
      - name: premium_currency_code
        businessName: Premium Currency Code
        logicalType: string
        required: false
        description: Currency code for the annualized premium amount.
      - name: created_datetime
        businessName: Created Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical policy term record was created.
      - name: updated_datetime
        businessName: Updated Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical policy term record was last updated.

relationships:
  - name: policy_term_to_policy
    description: Relates a policy term to the durable policy identity.
    relationshipType: many-to-one
    targetContractId: pc.policy
    sourceFields:
      - policy_id
    targetFields:
      - policy_id

quality:
  - rule: policy_term_id_required
    description: Policy term identifier must be populated.
    dimension: completeness
    severity: error
  - rule: policy_term_policy_id_required
    description: Policy identifier must be populated for every policy term.
    dimension: completeness
    severity: error
  - rule: policy_term_status_code_required
    description: Term status code must be populated for every policy term.
    dimension: completeness
    severity: error
  - rule: policy_term_dates_required
    description: Term effective date and term expiration date must be populated for every policy term.
    dimension: completeness
    severity: error
  - rule: policy_term_effective_date_before_expiration_date
    description: Term effective date must be earlier than term expiration date.
    dimension: consistency
    severity: error
  - rule: policy_term_annualized_premium_not_negative
    description: Annualized premium amount should not be negative when populated.
    dimension: validity
    severity: warning

customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: policy
  supportsPolicyLifecyclePattern: true
