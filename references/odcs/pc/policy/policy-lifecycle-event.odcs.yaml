apiVersion: v3.0.2
kind: DataContract
id: pc.policy-lifecycle-event
name: PolicyLifecycleEvent
version: 0.3.0
status: draft
description: Canonical contract for meaningful lifecycle events in a Property and Casualty policy.
domain: property-and-casualty
schema:
- name: policy_lifecycle_event
  physicalType: table
  description: Canonical policy lifecycle event record that preserves policy state change history separately from current policy status.
  properties:
  - name: policy_lifecycle_event_uid
    businessName: Policy Lifecycle Event Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical policy lifecycle event record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_uid
    businessName: Policy Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the policy associated with the lifecycle event.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_term_uid
    businessName: Policy Term Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy term associated with the lifecycle event when term context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: lifecycle_event_type_code
    businessName: Lifecycle Event Type Code
    logicalType: string
    required: true
    description: Business-facing code for the lifecycle event type.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: lifecycle_event_status_code
    businessName: Lifecycle Event Status Code
    logicalType: string
    required: false
    description: Current lifecycle status of the lifecycle event record.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: prior_status_code
    businessName: Prior Status Code
    logicalType: string
    required: false
    description: Policy or term status before the lifecycle event when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: resulting_status_code
    businessName: Resulting Status Code
    logicalType: string
    required: false
    description: Policy or term status after the lifecycle event when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: event_datetime
    businessName: Event Datetime
    logicalType: datetime
    required: true
    description: Datetime when the policy lifecycle event occurred.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: initiated_by_party_uid
    businessName: Initiated By Party Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the party that initiated the policy lifecycle event when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: event_description
    businessName: Event Description
    logicalType: string
    required: false
    description: Source-neutral business description of the policy lifecycle event when additional context is needed.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: triggering_transaction_uid
    businessName: Triggering Transaction Identifier
    logicalType: string
    required: false
    description: Optional reference to the transaction that produced this lifecycle event, when the event is the consequence of a processed transaction.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: correction_indicator
    businessName: Correction Indicator
    logicalType: boolean
    required: true
    description: True when this row corrects a previously emitted row. False for original (uncorrected) rows.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: corrects_policy_lifecycle_event_uid
    businessName: Corrects Record Identifier
    logicalType: string
    required: false
    description: Reference to the prior row that this row corrects. Populated only when correction_indicator is true.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: policy_lifecycle_event_to_policy
  description: Relates a policy lifecycle event to the policy whose lifecycle changed.
  relationshipType: many-to-one
  targetContractId: pc.policy
  sourceFields:
  - policy_uid
  targetFields:
  - policy_uid
- name: policy_lifecycle_event_to_policy_term
  description: Relates a policy lifecycle event to the policy term associated with the event when term context is known.
  relationshipType: many-to-one
  targetContractId: pc.policy-term
  sourceFields:
  - policy_term_uid
  targetFields:
  - policy_term_uid
- name: policy_lifecycle_event_to_lifecycle_event_type
  description: Relates a policy lifecycle event to lifecycle event type reference data when available.
  relationshipType: many-to-one
  targetContractId: pc.lifecycle-event-type
  sourceFields:
  - lifecycle_event_type_code
  targetFields:
  - code_value
- name: policy_lifecycle_event_to_initiating_party
  description: Relates a policy lifecycle event to the party that initiated it when known.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - initiated_by_party_uid
  targetFields:
  - party_uid
quality:
- rule: policy_lifecycle_event_uid_required
  description: policy_lifecycle_event_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: policy_lifecycle_event_policy_uid_required
  description: Policy identifier must be populated for every policy lifecycle event.
  dimension: completeness
  severity: error
- rule: policy_lifecycle_event_type_code_required
  description: Lifecycle event type code must be populated for every policy lifecycle event.
  dimension: completeness
  severity: error
- rule: policy_lifecycle_event_datetime_required
  description: Event datetime must be populated for every policy lifecycle event.
  dimension: completeness
  severity: error
- rule: correction_indicator_required
  description: correction_indicator must be populated for every event or transaction row.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: policy
  supportsPolicyLifecyclePattern: true
  classificationProfile: RESTRICTED
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — drop created_datetime, updated_datetime (append-only per temporal-modeling ADR); re-tag over-classified field(s) to INTERNAL: resulting_status_code; re-tag narrative
    free-text field(s) to CONFIDENTIAL + PII: event_description; drop redundant lifecycle_event_type_uid (keep lifecycle_event_type_code).'
