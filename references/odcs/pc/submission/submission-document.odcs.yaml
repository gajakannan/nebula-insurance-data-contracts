apiVersion: v3.0.2
kind: DataContract
id: pc.submission-document
name: SubmissionDocument
version: 0.1.0
status: draft
description: Canonical contract for documents associated with a Property and Casualty submission.

domain: property-and-casualty

schema:
  - name: submission_document
    physicalType: table
    description: Canonical submission document record that captures document identity, type, status, timing, and submission relationship context.
    properties:
      - name: submission_document_id
        businessName: Submission Document Identifier
        logicalType: string
        required: true
        primaryKey: true
        description: Stable identifier for the canonical submission document record.
      - name: submission_id
        businessName: Submission Identifier
        logicalType: string
        required: true
        description: Identifier for the submission associated with the document.
      - name: document_type_code
        businessName: Document Type Code
        logicalType: string
        required: true
        description: Classification of the document type.
      - name: document_status_code
        businessName: Document Status Code
        logicalType: string
        required: true
        description: Current lifecycle status of the submission document.
      - name: document_name
        businessName: Document Name
        logicalType: string
        required: false
        description: Business-facing name or label for the document.
      - name: document_reference
        businessName: Document Reference
        logicalType: string
        required: false
        description: Source-neutral business reference used to locate or reconcile the document.
      - name: required_indicator
        businessName: Required Indicator
        logicalType: boolean
        required: false
        description: Indicates whether the document is required for the submission context.
      - name: received_datetime
        businessName: Received Datetime
        logicalType: datetime
        required: false
        description: Datetime when the document was received.
      - name: issued_datetime
        businessName: Issued Datetime
        logicalType: datetime
        required: false
        description: Datetime when the document was issued or generated when applicable.
      - name: created_datetime
        businessName: Created Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical submission document record was created.
      - name: updated_datetime
        businessName: Updated Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical submission document record was last updated.

relationships:
  - name: submission_document_to_submission
    description: Relates a submission document to the submission associated with the document.
    relationshipType: many-to-one
    targetContractId: pc.submission
    sourceFields:
      - submission_id
    targetFields:
      - submission_id

quality:
  - rule: submission_document_id_required
    description: Submission document identifier must be populated.
    dimension: completeness
    severity: error
  - rule: submission_document_submission_id_required
    description: Submission identifier must be populated for every submission document.
    dimension: completeness
    severity: error
  - rule: submission_document_type_code_required
    description: Document type code must be populated for every submission document.
    dimension: completeness
    severity: error
  - rule: submission_document_status_code_required
    description: Document status code must be populated for every submission document.
    dimension: completeness
    severity: error

customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: submission
  supportsSubmissionLifecyclePattern: true
