apiVersion: v3.0.2
kind: DataContract
id: pc.submission-document
name: SubmissionDocument
version: 0.4.1
status: draft
description: Canonical contract for documents associated with a Property and Casualty submission.
domain: property-and-casualty
schema:
- name: submission_document
  physicalType: table
  description: Canonical submission document record that captures document identity, type, status, timing, and submission relationship context.
  properties:
  - name: submission_document_uid
    businessName: Submission Document Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical submission document record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: submission_uid
    businessName: Submission Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the submission associated with the document.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: document_type_code
    businessName: Document Type Code
    logicalType: string
    required: true
    description: Classification of the document type.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: document_status_code
    businessName: Document Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the submission document.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: document_title
    businessName: Document Title
    logicalType: string
    required: false
    description: Business-facing title for the submission document.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: external_storage_reference
    businessName: External Storage Reference
    logicalType: string
    required: false
    description: Source-neutral reference used to locate or reconcile the submission document in its system of record (storage URI, document-management identifier, etc.).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: required_indicator
    businessName: Required Indicator
    logicalType: boolean
    required: false
    description: Indicates whether the document is required for the submission context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: capture_datetime
    businessName: Capture Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical submission document record was captured into the warehouse. Distinct from issued / received which carry business semantics.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: received_datetime
    businessName: Received Datetime
    logicalType: datetime
    required: false
    description: Datetime when the document was received.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: issued_datetime
    businessName: Issued Datetime
    logicalType: datetime
    required: false
    description: Datetime when the document was issued or generated when applicable.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: contains_phi_indicator
    businessName: Contains PHI Indicator
    logicalType: boolean
    required: false
    description: Indicates whether the document contains protected health information; informs downstream masking and access controls.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical submission document record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical submission document record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: submission_document_to_submission
  description: Relates a submission document to the submission associated with the document.
  relationshipType: many-to-one
  targetContractId: pc.submission
  sourceFields:
  - submission_uid
  targetFields:
  - submission_uid
- name: submission_document_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
- name: submission_document_document_type_code_to_document_type_code
  description: Binds document_type_code to the canonical document-type-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.document-type-code
  sourceFields:
  - document_type_code
  targetFields:
  - code_value
- name: submission_document_document_status_code_to_document_status_code
  description: Binds document_status_code to the canonical document-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.document-status-code
  sourceFields:
  - document_status_code
  targetFields:
  - code_value
- name: submission_document_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
quality:
- rule: submission_document_uid_required
  description: submission_document_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: submission_document_submission_uid_required
  description: Submission identifier must be populated for every submission document.
  dimension: completeness
  severity: error
- rule: submission_document_type_code_required
  description: Document type code must be populated for every submission document.
  dimension: completeness
  severity: error
- rule: submission_document_status_code_required
  description: Document status code must be populated for every submission document.
  dimension: completeness
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: submission
  supportsSubmissionLifecyclePattern: true
  classificationProfile: INTERNAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - null-semantics
  - record-state
  - scd2-primary-key
  - separation-and-nesting
  - status-promotion
  - submission-modeling
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR.'
  - '0.4.0: Canonical hardening C4 — align document-contract field naming on the claim-document shape (C4.9): rename document_name → document_title, document_reference → external_storage_reference; add
    capture_datetime alongside existing received/issued_datetime; add contains_phi_indicator.'
  - '0.4.1: Canonical hardening C5 — bind 4 *_code field(s) to codeset(s) (C5.2).'
