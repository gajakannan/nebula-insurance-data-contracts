apiVersion: v3.0.2
kind: DataContract
id: pc.submission-assessment
name: SubmissionAssessment
version: 0.4.2
status: proposed
description: Canonical contract for underwriting, triage, clearance, referral, or risk assessment activity within a Property and Casualty submission.
domain: property-and-casualty
schema:
- name: submission_assessment
  physicalType: table
  description: Canonical submission assessment record that captures assessment result, rationale, dates, and relationship context.
  properties:
  - name: submission_assessment_uid
    businessName: Submission Assessment Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical submission assessment record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: submission_uid
    businessName: Submission Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the submission being assessed.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: submission_risk_uid
    businessName: Submission Risk Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the submitted risk being assessed when the assessment is risk-specific.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: assessment_type_code
    businessName: Assessment Type Code
    logicalType: string
    required: true
    description: Classification of the assessment type.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: assessment_status_code
    businessName: Assessment Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the assessment.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: assessment_result_code
    businessName: Assessment Result Code
    logicalType: string
    required: false
    description: Result or outcome classification for the assessment.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: assessed_by_party_uid
    businessName: Assessed By Party Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the party that performed or is accountable for the assessment when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: assessment_datetime
    businessName: Assessment Datetime
    logicalType: datetime
    required: false
    description: Datetime when the assessment was performed or completed.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: referral_indicator
    businessName: Referral Indicator
    logicalType: boolean
    required: false
    description: Indicates whether the assessment resulted in or required referral.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: assessment_summary
    businessName: Assessment Summary
    logicalType: string
    required: false
    description: Source-neutral summary of the assessment rationale or result.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: source_created_datetime
    businessName: Source Created Datetime
    logicalType: datetime
    required: false
    description: Source-system timestamp asserting when this record was created. Captured for late-arriving-data analysis; distinct from the SCD2 system-time start in valid_from_datetime.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_updated_datetime
    businessName: Source Updated Datetime
    logicalType: datetime
    required: false
    description: Source-system timestamp asserting when this record was last updated. Captured for late-arriving-data analysis; distinct from the SCD2 system-time markers valid_from_datetime / valid_to_datetime.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: submission_assessment_to_submission
  description: Relates a submission assessment to the submission being assessed.
  relationshipType: many-to-one
  targetContractId: pc.submission
  sourceFields:
  - submission_uid
  targetFields:
  - submission_uid
- name: submission_assessment_to_submission_risk
  description: Relates a submission assessment to a submitted risk when the assessment is risk-specific.
  relationshipType: many-to-one
  targetContractId: pc.submission-risk
  sourceFields:
  - submission_risk_uid
  targetFields:
  - submission_risk_uid
- name: submission_assessment_to_assessed_by_party
  description: Relates a submission assessment to the party that performed or is accountable for the assessment when known.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - assessed_by_party_uid
  targetFields:
  - party_uid
- name: submission_assessment_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
- name: submission_assessment_assessment_type_code_to_assessment_type_code
  description: Binds assessment_type_code to the canonical assessment-type-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.assessment-type-code
  sourceFields:
  - assessment_type_code
  targetFields:
  - code_value
- name: submission_assessment_assessment_status_code_to_assessment_status_code
  description: Binds assessment_status_code to the canonical assessment-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.assessment-status-code
  sourceFields:
  - assessment_status_code
  targetFields:
  - code_value
- name: submission_assessment_assessment_result_code_to_assessment_result_code
  description: Binds assessment_result_code to the canonical assessment-result-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.assessment-result-code
  sourceFields:
  - assessment_result_code
  targetFields:
  - code_value
- name: submission_assessment_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
quality:
- rule: submission_assessment_uid_required
  description: submission_assessment_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: submission_assessment_submission_uid_required
  description: Submission identifier must be populated for every submission assessment.
  dimension: completeness
  severity: error
- rule: submission_assessment_type_code_required
  description: Assessment type code must be populated for every submission assessment.
  dimension: completeness
  severity: error
- rule: submission_assessment_status_code_required
  description: Assessment status code must be populated for every submission assessment.
  dimension: completeness
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: submission
  supportsSubmissionLifecyclePattern: true
  classificationProfile: CONFIDENTIAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - null-semantics
  - record-state
  - scd2-primary-key
  - status-promotion
  - submission-modeling
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR; re-tag narrative free-text field(s) to CONFIDENTIAL + PII: assessment_summary; raise classificationProfile
    INTERNAL → CONFIDENTIAL (matches max field sensitivity).'
  - '0.4.0: Canonical hardening C5 — bind 5 *_code field(s) to codeset(s) (C5.2).'
  - '0.4.1: Canonical hardening C7 — rename created_datetime → source_created_datetime; updated_datetime → source_updated_datetime — capture source-system time, distinct from SCD2 system time (C7.4).'
  - '0.4.2: Promoted from draft to proposed (M10.6, 2026-05-08).'
