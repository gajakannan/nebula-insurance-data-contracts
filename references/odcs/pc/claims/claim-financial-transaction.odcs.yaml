apiVersion: v3.0.2
kind: DataContract
id: pc.claim-financial-transaction
name: ClaimFinancialTransaction
version: 0.1.0
status: draft
description: Canonical contract for claim-related financial activity such as reserves, payments, recoveries, salvage, subrogation, and expense activity.
domain: property-and-casualty
schema:
- name: claim_financial_transaction
  physicalType: table
  description: Append-only canonical record of a financial movement attached to a claim. Specializes the FinancialTransaction pattern with claim, feature, coverage, party-role, and reserve-category context. Original rows are immutable; corrections are emitted as new rows referencing the corrected row.
  properties:
  - name: claim_financial_transaction_uid
    businessName: Claim Financial Transaction Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical claim financial transaction record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: claim_uid
    businessName: Claim Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the claim associated with the transaction.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: claim_feature_uid
    businessName: Claim Feature Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the claim feature when the transaction is feature-specific.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: claim_coverage_uid
    businessName: Claim Coverage Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the claim coverage that the transaction is booked against when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: payee_party_role_uid
    businessName: Payee Party Role Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the claim party role that is the payee of the transaction when applicable.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_type_code
    businessName: Transaction Type Code
    logicalType: string
    required: true
    description: Classification of the transaction such as PAYMENT, RESERVE_CHANGE, RECOVERY, SALVAGE, SUBROGATION, DEDUCTIBLE_RECOVERY, or EXPENSE. References the TransactionType codeset.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_classification_code
    businessName: Transaction Classification Code
    logicalType: string
    required: false
    description: Optional secondary classification (e.g. INDEMNITY, EXPENSE_ALAE, EXPENSE_ULAE, RESERVE_INDEMNITY, RESERVE_EXPENSE) used by analytics and reporting.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: reserve_category_code
    businessName: Reserve Category Code
    logicalType: string
    required: false
    description: Reserve category for transactions that affect a reserve, such as INDEMNITY_RESERVE or EXPENSE_RESERVE. Null for transactions that do not affect a reserve.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_amount
    businessName: Transaction Amount
    logicalType: decimal
    required: true
    description: Signed monetary amount of the transaction in the transactional currency. Sign convention is positive for outbound payments and reserve increases, negative for recoveries and reserve decreases.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - FINANCIAL
  - name: transaction_currency_code
    businessName: Transaction Currency Code
    logicalType: string
    required: true
    description: Currency code for the transaction amount. References the CurrencyCode codeset.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_effective_date
    businessName: Transaction Effective Date
    logicalType: date
    required: true
    description: Business-effective date of the transaction.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_processed_datetime
    businessName: Transaction Processed Datetime
    logicalType: datetime
    required: false
    description: Datetime when the transaction was processed or posted.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: accounting_period_code
    businessName: Accounting Period Code
    logicalType: string
    required: false
    description: Accounting period to which the transaction is booked (e.g. YYYY-MM, YYYY-QN) when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: lifecycle_event_uid
    businessName: Lifecycle Event Identifier
    logicalType: string
    required: false
    description: Optional reference to the claim lifecycle event that this transaction realizes (per the event-and-transaction ADR).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_narrative
    businessName: Transaction Narrative
    logicalType: string
    required: false
    description: Source-neutral narrative describing the transaction when additional context is needed.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: correction_indicator
    businessName: Correction Indicator
    logicalType: boolean
    required: true
    description: True when this row corrects a previously emitted row. False for original (uncorrected) rows.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: corrects_claim_financial_transaction_uid
    businessName: Corrects Record Identifier
    logicalType: string
    required: false
    description: Reference to the prior row that this row corrects. Populated only when correction_indicator is true.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: claim_financial_transaction_to_claim
  description: Relates a claim financial transaction to the claim associated with the transaction.
  relationshipType: many-to-one
  targetContractId: pc.claim
  sourceFields:
  - claim_uid
  targetFields:
  - claim_uid
- name: claim_financial_transaction_to_claim_feature
  description: Relates a claim financial transaction to the claim feature when feature context is known.
  relationshipType: many-to-one
  targetContractId: pc.claim-feature
  sourceFields:
  - claim_feature_uid
  targetFields:
  - claim_feature_uid
- name: claim_financial_transaction_to_claim_coverage
  description: Relates a claim financial transaction to the claim coverage that it is booked against when known.
  relationshipType: many-to-one
  targetContractId: pc.claim-coverage
  sourceFields:
  - claim_coverage_uid
  targetFields:
  - claim_coverage_uid
- name: claim_financial_transaction_to_payee_party_role
  description: Relates a claim financial transaction to the claim party role that is the payee when applicable.
  relationshipType: many-to-one
  targetContractId: pc.claim-party-role
  sourceFields:
  - payee_party_role_uid
  targetFields:
  - claim_party_role_uid
- name: claim_financial_transaction_to_transaction_type
  description: Relates a claim financial transaction to the TransactionType codeset.
  relationshipType: many-to-one
  targetContractId: pc.transaction-type
  sourceFields:
  - transaction_type_code
  targetFields:
  - code_value
- name: claim_financial_transaction_to_currency
  description: Relates the transaction amount to its currency code.
  relationshipType: many-to-one
  targetContractId: pc.currency-code
  sourceFields:
  - transaction_currency_code
  targetFields:
  - code_value
- name: claim_financial_transaction_to_lifecycle_event
  description: Relates a claim financial transaction to the lifecycle event it realizes when applicable.
  relationshipType: many-to-one
  targetContractId: pc.claim-lifecycle-event
  sourceFields:
  - lifecycle_event_uid
  targetFields:
  - claim_lifecycle_event_uid
quality:
- rule: claim_financial_transaction_uid_required
  description: claim_financial_transaction_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: claim_financial_transaction_claim_uid_required
  description: Claim identifier must be populated for every claim financial transaction.
  dimension: completeness
  severity: error
- rule: claim_financial_transaction_type_code_required
  description: Transaction type code must be populated for every claim financial transaction.
  dimension: completeness
  severity: error
- rule: claim_financial_transaction_amount_required
  description: Transaction amount must be populated for every claim financial transaction.
  dimension: completeness
  severity: error
- rule: claim_financial_transaction_currency_required
  description: Transaction currency code must be populated whenever transaction amount is populated.
  dimension: completeness
  severity: error
- rule: claim_financial_transaction_effective_date_required
  description: Transaction effective date must be populated for every claim financial transaction.
  dimension: completeness
  severity: error
- rule: correction_indicator_required
  description: correction_indicator must be populated for every event or transaction row.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: claims
  supportsFinancialTransactionPattern: true
  classificationProfile: CONFIDENTIAL
  changelog:
  - '0.1.0: Initial claim financial transaction contract per claims-modeling and event-and-transaction ADRs.'
