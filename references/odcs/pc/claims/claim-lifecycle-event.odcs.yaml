apiVersion: v3.0.2
kind: DataContract
id: pc.claim-lifecycle-event
name: ClaimLifecycleEvent
version: 0.1.0
status: draft
description: Canonical contract for lifecycle events in the Property and Casualty claim history.
domain: property-and-casualty
schema:
- name: claim_lifecycle_event
  physicalType: table
  description: Append-only canonical record of a business-meaningful state change in the claim history. Examples include FNOL received, acknowledged, assigned, reserved, partial payment, full payment, closed,
    reopened, subrogation initiated, salvage initiated, denied, and withdrawn.
  properties:
  - name: claim_lifecycle_event_uid
    businessName: Claim Lifecycle Event Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical claim lifecycle event record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: claim_uid
    businessName: Claim Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the claim associated with the event.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: claim_feature_uid
    businessName: Claim Feature Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the claim feature associated with the event when feature context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: lifecycle_event_type_code
    businessName: Lifecycle Event Type Code
    logicalType: string
    required: true
    description: Classification of the lifecycle event. References the LifecycleEventType codeset.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: event_datetime
    businessName: Event Datetime
    logicalType: datetime
    required: true
    description: Datetime when the event occurred or was recognized.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Business-effective date for the event when it differs from the event datetime.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: actor_party_uid
    businessName: Actor Party Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the party that performed or owned the event when known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: reason_code
    businessName: Reason Code
    logicalType: string
    required: false
    description: Classification of the reason for the event when applicable.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: event_narrative
    businessName: Event Narrative
    logicalType: string
    required: false
    description: Source-neutral narrative describing the event when additional context is needed.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: triggering_transaction_uid
    businessName: Triggering Transaction Identifier
    logicalType: string
    required: false
    description: Optional reference to the transaction that produced this lifecycle event, when the event is the consequence of a processed transaction.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: correction_indicator
    businessName: Correction Indicator
    logicalType: boolean
    required: true
    description: True when this row corrects a previously emitted row. False for original (uncorrected) rows.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: corrects_claim_lifecycle_event_uid
    businessName: Corrects Record Identifier
    logicalType: string
    required: false
    description: Reference to the prior row that this row corrects. Populated only when correction_indicator is true.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: claim_lifecycle_event_to_claim
  description: Relates a claim lifecycle event to the claim associated with the event.
  relationshipType: many-to-one
  targetContractId: pc.claim
  sourceFields:
  - claim_uid
  targetFields:
  - claim_uid
- name: claim_lifecycle_event_to_claim_feature
  description: Relates a claim lifecycle event to the claim feature when feature context is known.
  relationshipType: many-to-one
  targetContractId: pc.claim-feature
  sourceFields:
  - claim_feature_uid
  targetFields:
  - claim_feature_uid
- name: claim_lifecycle_event_to_event_type
  description: Relates a claim lifecycle event to the LifecycleEventType codeset.
  relationshipType: many-to-one
  targetContractId: pc.lifecycle-event-type
  sourceFields:
  - lifecycle_event_type_code
  targetFields:
  - code_value
- name: claim_lifecycle_event_to_actor_party
  description: Relates a claim lifecycle event to the party that performed or owned it when known.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - actor_party_uid
  targetFields:
  - party_uid
quality:
- rule: claim_lifecycle_event_uid_required
  description: claim_lifecycle_event_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: claim_lifecycle_event_claim_uid_required
  description: Claim identifier must be populated for every claim lifecycle event.
  dimension: completeness
  severity: error
- rule: claim_lifecycle_event_type_code_required
  description: Lifecycle event type code must be populated for every claim lifecycle event.
  dimension: completeness
  severity: error
- rule: claim_lifecycle_event_datetime_required
  description: Event datetime must be populated for every claim lifecycle event.
  dimension: completeness
  severity: error
- rule: correction_indicator_required
  description: correction_indicator must be populated for every event or transaction row.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: claims
  supportsClaimLifecyclePattern: true
  classificationProfile: CONFIDENTIAL
  changelog:
  - '0.1.0: Initial claim lifecycle event contract per claims-modeling and event-and-transaction ADRs.'
