apiVersion: v3.0.2
kind: DataContract
id: pc.financial-transaction
name: FinancialTransaction
version: 0.4.1
status: proposed
description: Canonical contract for monetary activity associated with Property and Casualty policy, claim, coverage, party, and exposure context.
domain: property-and-casualty
schema:
- name: financial_transaction
  physicalType: table
  description: Canonical financial transaction record that represents policy and claim monetary movement without creating one contract per money subtype.
  properties:
  - name: financial_transaction_uid
    businessName: Financial Transaction Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical financial transaction record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_number
    businessName: Transaction Number
    logicalType: string
    required: false
    description: Business-facing number or reference assigned to the financial transaction when available.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_type_code
    businessName: Transaction Type Code
    logicalType: string
    required: true
    description: Classification of the financial transaction type.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_classification_code
    businessName: Transaction Classification Code
    logicalType: string
    required: false
    description: Classification of the monetary movement, such as premium, fee, tax, commission, payment, reserve, recovery, salvage, or subrogation.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_effective_date
    businessName: Transaction Effective Date
    logicalType: date
    required: false
    description: Date when the financial transaction becomes effective for business purposes.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_posted_date
    businessName: Transaction Posted Date
    logicalType: date
    required: false
    description: Date when the financial transaction was posted or recorded.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: accounting_period_code
    businessName: Accounting Period Code
    logicalType: string
    required: false
    description: Accounting period associated with the financial transaction.
    customProperties:
      classifications:
        sensitivity: INTERNAL
      codesetExempt: true
      codesetExemptReason: Carrier-accounting period identifier (YYYY-MM or YYYYNN); format varies per carrier and is not canonical.
  - name: transaction_amount
    businessName: Transaction Amount
    logicalType: decimal
    required: true
    description: Monetary amount of the financial transaction.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - FINANCIAL
  - name: transaction_currency_code
    businessName: Transaction Currency Code
    logicalType: string
    required: true
    description: Currency code for the transaction amount.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: debit_credit_code
    businessName: Debit Credit Code
    logicalType: string
    required: false
    description: Classification indicating whether the transaction is a debit, credit, or other recognized accounting direction.
    customProperties:
      classifications:
        sensitivity: INTERNAL
      codesetExempt: true
      codesetExemptReason: Two-value enumeration (DR / CR) enforced by inline quality rule; codeset overhead unwarranted.
  - name: policy_uid
    businessName: Policy Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy associated with the financial transaction when policy context is available.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: claim_uid
    businessName: Claim Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the claim associated with the financial transaction when claim context is available.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_coverage_uid
    businessName: Policy Coverage Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy coverage associated with the financial transaction when coverage context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: party_uid
    businessName: Party Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the party associated with the financial transaction when party context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: exposure_uid
    businessName: Exposure Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the exposure associated with the financial transaction when exposure context is known.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_transaction_reference
    businessName: Source Transaction Reference
    logicalType: string
    required: false
    description: Source-neutral business reference that helps reconcile the financial transaction across processing contexts.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: transaction_description
    businessName: Transaction Description
    logicalType: string
    required: false
    description: Source-neutral business description of the financial transaction when additional context is needed.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: lifecycle_event_uid
    businessName: Lifecycle Event Identifier
    logicalType: string
    required: false
    description: Optional reference to the lifecycle event that this transaction realizes (per the event-and-transaction ADR).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: correction_indicator
    businessName: Correction Indicator
    logicalType: boolean
    required: true
    description: True when this row corrects a previously emitted row. False for original (uncorrected) rows.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: corrects_financial_transaction_uid
    businessName: Corrects Record Identifier
    logicalType: string
    required: false
    description: Reference to the prior row that this row corrects. Populated only when correction_indicator is true.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: financial_transaction_to_policy
  description: Relates a financial transaction to the policy associated with the monetary movement when policy context is available.
  relationshipType: many-to-one
  targetContractId: pc.policy
  sourceFields:
  - policy_uid
  targetFields:
  - policy_uid
- name: financial_transaction_to_claim
  description: Relates a financial transaction to the claim associated with the monetary movement when claim context is available.
  relationshipType: many-to-one
  targetContractId: pc.claim
  sourceFields:
  - claim_uid
  targetFields:
  - claim_uid
- name: financial_transaction_to_policy_coverage
  description: Relates a financial transaction to policy coverage when coverage context is known.
  relationshipType: many-to-one
  targetContractId: pc.policy-coverage
  sourceFields:
  - policy_coverage_uid
  targetFields:
  - policy_coverage_uid
- name: financial_transaction_to_party
  description: Relates a financial transaction to a party associated with the monetary movement when party context is known.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - party_uid
  targetFields:
  - party_uid
- name: financial_transaction_to_exposure
  description: Relates a financial transaction to an exposure associated with the monetary movement when exposure context is known.
  relationshipType: many-to-one
  targetContractId: pc.exposure
  sourceFields:
  - exposure_uid
  targetFields:
  - exposure_uid
- name: financial_transaction_transaction_type_code_to_transaction_type
  description: Binds transaction_type_code to the canonical transaction-type codeset.
  relationshipType: many-to-one
  targetContractId: pc.transaction-type
  sourceFields:
  - transaction_type_code
  targetFields:
  - code_value
- name: financial_transaction_transaction_classification_code_to_financial_transaction_classification
  description: Binds transaction_classification_code to the canonical financial-transaction-classification codeset.
  relationshipType: many-to-one
  targetContractId: pc.financial-transaction-classification
  sourceFields:
  - transaction_classification_code
  targetFields:
  - code_value
- name: financial_transaction_transaction_currency_code_to_currency_code
  description: Binds transaction_currency_code to the canonical currency-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.currency-code
  sourceFields:
  - transaction_currency_code
  targetFields:
  - code_value
quality:
- rule: financial_transaction_uid_required
  description: financial_transaction_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: financial_transaction_type_code_required
  description: Transaction type code must be populated.
  dimension: completeness
  severity: error
- rule: financial_transaction_amount_required
  description: Transaction amount must be populated.
  dimension: completeness
  severity: error
- rule: financial_transaction_currency_code_required
  description: Transaction currency code must be populated.
  dimension: completeness
  severity: error
- rule: financial_transaction_has_business_context
  description: At least one policy, claim, coverage, party, or exposure context should be populated for the financial transaction.
  dimension: completeness
  severity: warning
- rule: correction_indicator_required
  description: correction_indicator must be populated for every event or transaction row.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: financial
  supportsFinancialTransactionPattern: true
  classificationProfile: RESTRICTED
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - currency-convention
  - data-classification
  - event-and-transaction
  - financial-modeling
  - identifier-strategy
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — drop created_datetime, updated_datetime (append-only per temporal-modeling ADR); drop mutable transaction_status_code (status belongs on lifecycle events); re-tag over-classified
    field(s) to INTERNAL: accounting_period_code; re-tag narrative free-text field(s) to CONFIDENTIAL + PII: transaction_description.'
  - '0.4.0: Canonical hardening C5 — bind 3 *_code field(s) to codeset(s) (C5.2); add codesetExempt to 2 field(s) (C5.2).'
  - '0.4.1: Promoted from draft to proposed (M10.6, 2026-05-08).'
