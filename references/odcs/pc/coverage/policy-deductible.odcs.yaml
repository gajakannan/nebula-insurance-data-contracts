apiVersion: v3.0.2
kind: DataContract
id: pc.policy-deductible
name: PolicyDeductible
version: 0.1.0
status: draft
description: Canonical contract for structured deductible detail associated with a Property and Casualty policy coverage.

domain: property-and-casualty

schema:
  - name: policy_deductible
    physicalType: table
    description: Canonical policy deductible record that describes deductible terms applied within a policy coverage context.
    properties:
      - name: policy_deductible_id
        businessName: Policy Deductible Identifier
        logicalType: string
        required: true
        primaryKey: true
        description: Stable identifier for the canonical policy deductible record.
      - name: policy_coverage_id
        businessName: Policy Coverage Identifier
        logicalType: string
        required: true
        description: Identifier for the policy coverage associated with the deductible.
      - name: deductible_type_code
        businessName: Deductible Type Code
        logicalType: string
        required: true
        description: Classification of the deductible type.
      - name: deductible_basis_code
        businessName: Deductible Basis Code
        logicalType: string
        required: false
        description: Classification of the basis to which the deductible applies, such as occurrence, claim, item, location, or policy term.
      - name: deductible_amount
        businessName: Deductible Amount
        logicalType: decimal
        required: false
        description: Monetary amount of the deductible when represented as an amount.
      - name: deductible_currency_code
        businessName: Deductible Currency Code
        logicalType: string
        required: false
        description: Currency code for the deductible amount.
      - name: deductible_percent
        businessName: Deductible Percent
        logicalType: decimal
        required: false
        description: Percentage value of the deductible when represented as a percentage.
      - name: minimum_deductible_amount
        businessName: Minimum Deductible Amount
        logicalType: decimal
        required: false
        description: Minimum monetary deductible amount when the deductible uses a threshold.
      - name: maximum_deductible_amount
        businessName: Maximum Deductible Amount
        logicalType: decimal
        required: false
        description: Maximum monetary deductible amount when the deductible uses a cap.
      - name: effective_date
        businessName: Effective Date
        logicalType: date
        required: false
        description: Date when the policy deductible becomes effective within the policy coverage context.
      - name: expiration_date
        businessName: Expiration Date
        logicalType: date
        required: false
        description: Date when the policy deductible stops being effective within the policy coverage context.
      - name: created_datetime
        businessName: Created Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical policy deductible record was created.
      - name: updated_datetime
        businessName: Updated Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical policy deductible record was last updated.

relationships:
  - name: policy_deductible_to_policy_coverage
    description: Relates a policy deductible to the policy coverage where the deductible applies.
    relationshipType: many-to-one
    targetContractId: pc.policy-coverage
    sourceFields:
      - policy_coverage_id
    targetFields:
      - policy_coverage_id

quality:
  - rule: policy_deductible_id_required
    description: Policy deductible identifier must be populated.
    dimension: completeness
    severity: error
  - rule: policy_deductible_policy_coverage_id_required
    description: Policy coverage identifier must be populated for every policy deductible.
    dimension: completeness
    severity: error
  - rule: policy_deductible_type_code_required
    description: Deductible type code must be populated for every policy deductible.
    dimension: completeness
    severity: error
  - rule: policy_deductible_amounts_not_negative
    description: Deductible amounts should not be negative when populated.
    dimension: validity
    severity: warning
  - rule: policy_deductible_percent_not_negative
    description: Deductible percent should not be negative when populated.
    dimension: validity
    severity: warning
  - rule: policy_deductible_effective_date_not_after_expiration_date
    description: Effective date must not be later than expiration date when both dates are populated.
    dimension: consistency
    severity: error

customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: coverage
  supportsPolicyCoveragePattern: true
