apiVersion: v3.0.2
kind: DataContract
id: pc.coverage
name: Coverage
version: 0.4.0
status: draft
description: Canonical contract for a reusable Property and Casualty coverage concept.
domain: property-and-casualty
schema:
- name: coverage
  physicalType: table
  description: Canonical coverage definition that describes a reusable protection concept before it is selected or applied on a policy.
  properties:
  - name: coverage_uid
    businessName: Coverage Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical coverage record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: coverage_code
    businessName: Coverage Code
    logicalType: string
    required: true
    description: Business-facing code that classifies the coverage definition.
    customProperties:
      classifications:
        sensitivity: INTERNAL
      codesetExempt: true
      codesetExemptReason: Identifier for a Coverage record; references the Coverage entity contract rather than a codeset.
  - name: coverage_name
    businessName: Coverage Name
    logicalType: string
    required: true
    description: Business-facing name of the coverage definition.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: coverage_description
    businessName: Coverage Description
    logicalType: string
    required: false
    description: Source-neutral business description of the protection provided by the coverage.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: coverage_type_code
    businessName: Coverage Type Code
    logicalType: string
    required: false
    description: Classification of the coverage by protection type or coverage family.
    customProperties:
      classifications:
        sensitivity: INTERNAL
      codesetExempt: true
      codesetExemptReason: Coverage-internal classification managed at the carrier-product level; canonical taxonomy is line_of_business + coverage_basis_code.
  - name: coverage_category_code
    businessName: Coverage Category Code
    logicalType: string
    required: false
    description: Higher-level grouping used to organize related coverage definitions.
    customProperties:
      classifications:
        sensitivity: INTERNAL
      codesetExempt: true
      codesetExemptReason: Carrier-product coverage grouping; canonical codeset deferred.
  - name: line_of_business_code
    businessName: Line Of Business Code
    logicalType: string
    required: true
    description: Classification of the insurance line of business where the coverage is generally offered.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: product_uid
    businessName: Product Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the product that offers the coverage when the coverage is product-specific.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: coverage_status_code
    businessName: Coverage Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the coverage definition.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the coverage definition becomes effective for canonical use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the coverage definition stops being effective for canonical use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical coverage definition was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical coverage definition was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: coverage_to_product
  description: Relates a coverage definition to the product that offers it when the coverage is product-specific.
  relationshipType: many-to-one
  targetContractId: pc.product
  sourceFields:
  - product_uid
  targetFields:
  - product_uid
- name: coverage_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
- name: coverage_line_of_business_code_to_line_of_business
  description: Binds line_of_business_code to the canonical line-of-business codeset.
  relationshipType: many-to-one
  targetContractId: pc.line-of-business
  sourceFields:
  - line_of_business_code
  targetFields:
  - code_value
- name: coverage_coverage_status_code_to_coverage_status_code
  description: Binds coverage_status_code to the canonical coverage-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.coverage-status-code
  sourceFields:
  - coverage_status_code
  targetFields:
  - code_value
- name: coverage_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
quality:
- rule: coverage_uid_required
  description: coverage_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: coverage_code_required
  description: Coverage code must be populated.
  dimension: completeness
  severity: error
- rule: coverage_name_required
  description: Coverage name must be populated.
  dimension: completeness
  severity: error
- rule: coverage_line_of_business_code_required
  description: Line of business code must be populated for every coverage definition.
  dimension: completeness
  severity: error
- rule: coverage_status_code_required
  description: Coverage status code must be populated.
  dimension: completeness
  severity: error
- rule: coverage_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: coverage
  supportsPolicyCoveragePattern: true
  classificationProfile: CONFIDENTIAL
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR; re-tag narrative free-text field(s) to CONFIDENTIAL + PII: coverage_description; raise classificationProfile
    INTERNAL → CONFIDENTIAL (matches max field sensitivity).'
  - '0.4.0: Canonical hardening C5 — bind 4 *_code field(s) to codeset(s) (C5.2); add codesetExempt to 3 field(s) (C5.2).'
