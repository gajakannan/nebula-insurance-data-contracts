apiVersion: v3.0.2
kind: DataContract
id: pc.policy-limit
name: PolicyLimit
version: 0.3.0
status: draft
description: Canonical contract for structured limit detail associated with a Property and Casualty policy coverage.
domain: property-and-casualty
schema:
- name: policy_limit
  physicalType: table
  description: Canonical policy limit record that describes monetary or non-monetary limits applied within a policy coverage context.
  properties:
  - name: policy_limit_uid
    businessName: Policy Limit Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical policy limit record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_coverage_uid
    businessName: Policy Coverage Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the policy coverage associated with the limit.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: limit_type_code
    businessName: Limit Type Code
    logicalType: string
    required: true
    description: Classification of the limit type.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: limit_basis_code
    businessName: Limit Basis Code
    logicalType: string
    required: false
    description: Classification of the basis to which the limit applies, such as occurrence, aggregate, person, item, location, or policy term.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: limit_amount
    businessName: Limit Amount
    logicalType: decimal
    required: false
    description: Monetary amount of the limit when represented as a single amount.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - FINANCIAL
  - name: limit_currency_code
    businessName: Limit Currency Code
    logicalType: string
    required: false
    description: Currency code for the limit amount.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: limit_quantity
    businessName: Limit Quantity
    logicalType: decimal
    required: false
    description: Non-monetary quantity for the limit when applicable.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: limit_unit_code
    businessName: Limit Unit Code
    logicalType: string
    required: false
    description: Unit of measure for the limit quantity.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the policy limit becomes effective within the policy coverage context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the policy limit stops being effective within the policy coverage context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical policy limit record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical policy limit record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: policy_limit_to_policy_coverage
  description: Relates a policy limit to the policy coverage where the limit applies.
  relationshipType: many-to-one
  targetContractId: pc.policy-coverage
  sourceFields:
  - policy_coverage_uid
  targetFields:
  - policy_coverage_uid
quality:
- rule: policy_limit_uid_required
  description: policy_limit_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: policy_limit_policy_coverage_uid_required
  description: Policy coverage identifier must be populated for every policy limit.
  dimension: completeness
  severity: error
- rule: policy_limit_type_code_required
  description: Limit type code must be populated for every policy limit.
  dimension: completeness
  severity: error
- rule: policy_limit_amount_not_negative
  description: Limit amount should not be negative when populated.
  dimension: validity
  severity: warning
- rule: policy_limit_quantity_not_negative
  description: Limit quantity should not be negative when populated.
  dimension: validity
  severity: warning
- rule: policy_limit_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: coverage
  supportsPolicyCoveragePattern: true
  classificationProfile: CONFIDENTIAL
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR.'
