apiVersion: v3.0.2
kind: DataContract
id: pc.policy-coverage
name: PolicyCoverage
version: 0.4.0
status: draft
description: Canonical contract for coverage selected or applied within a Property and Casualty policy context.
domain: property-and-casualty
schema:
- name: policy_coverage
  physicalType: table
  description: Canonical policy coverage record that connects a policy to a reusable coverage definition and captures the coverage selection context.
  properties:
  - name: policy_coverage_uid
    businessName: Policy Coverage Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical policy coverage record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_uid
    businessName: Policy Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the policy where the coverage is selected or applied.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: coverage_uid
    businessName: Coverage Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the reusable coverage definition selected or applied on the policy.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_term_uid
    businessName: Policy Term Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy term where the coverage applies when term detail is represented separately.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: exposure_uid
    businessName: Exposure Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the exposure to which the coverage applies when coverage is exposure-specific.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_limit_uid
    businessName: Policy Limit Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy limit detail associated with the coverage when represented separately.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: policy_deductible_uid
    businessName: Policy Deductible Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the policy deductible detail associated with the coverage when represented separately.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: coverage_sequence_number
    businessName: Coverage Sequence Number
    logicalType: integer
    required: false
    description: Ordering value used when multiple coverage records must be presented or processed in sequence within the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: coverage_status_code
    businessName: Coverage Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the coverage within the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: coverage_level_code
    businessName: Coverage Level Code
    logicalType: string
    required: false
    description: Classification of the level where the coverage applies, such as policy, term, location, item, exposure, or coverage part.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: coverage_basis_code
    businessName: Coverage Basis Code
    logicalType: string
    required: false
    description: Classification of the basis used to apply the coverage within the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: selected_indicator
    businessName: Selected Indicator
    logicalType: boolean
    required: false
    description: Indicates whether the coverage was selected for the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: mandatory_indicator
    businessName: Mandatory Indicator
    logicalType: boolean
    required: false
    description: Indicates whether the coverage is mandatory within the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the coverage becomes effective within the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the coverage stops being effective within the policy context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical policy coverage record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical policy coverage record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: policy_coverage_to_policy
  description: Relates a policy coverage record to the policy where the coverage is selected or applied.
  relationshipType: many-to-one
  targetContractId: pc.policy
  sourceFields:
  - policy_uid
  targetFields:
  - policy_uid
- name: policy_coverage_to_coverage
  description: Relates a policy coverage record to the reusable coverage definition.
  relationshipType: many-to-one
  targetContractId: pc.coverage
  sourceFields:
  - coverage_uid
  targetFields:
  - coverage_uid
- name: policy_coverage_to_policy_term
  description: Relates a policy coverage record to the policy term where the coverage applies when term detail is available.
  relationshipType: many-to-one
  targetContractId: pc.policy-term
  sourceFields:
  - policy_term_uid
  targetFields:
  - policy_term_uid
- name: policy_coverage_to_exposure
  description: Relates a policy coverage record to the exposure where the coverage applies when coverage is exposure-specific.
  relationshipType: many-to-one
  targetContractId: pc.exposure
  sourceFields:
  - exposure_uid
  targetFields:
  - exposure_uid
- name: policy_coverage_to_policy_limit
  description: Relates a policy coverage record to structured limit detail when represented separately.
  relationshipType: many-to-one
  targetContractId: pc.policy-limit
  sourceFields:
  - policy_limit_uid
  targetFields:
  - policy_limit_uid
- name: policy_coverage_to_policy_deductible
  description: Relates a policy coverage record to structured deductible detail when represented separately.
  relationshipType: many-to-one
  targetContractId: pc.policy-deductible
  sourceFields:
  - policy_deductible_uid
  targetFields:
  - policy_deductible_uid
- name: policy_coverage_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
- name: policy_coverage_coverage_status_code_to_coverage_status_code
  description: Binds coverage_status_code to the canonical coverage-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.coverage-status-code
  sourceFields:
  - coverage_status_code
  targetFields:
  - code_value
- name: policy_coverage_coverage_level_code_to_coverage_level_code
  description: Binds coverage_level_code to the canonical coverage-level-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.coverage-level-code
  sourceFields:
  - coverage_level_code
  targetFields:
  - code_value
- name: policy_coverage_coverage_basis_code_to_coverage_basis_code
  description: Binds coverage_basis_code to the canonical coverage-basis-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.coverage-basis-code
  sourceFields:
  - coverage_basis_code
  targetFields:
  - code_value
- name: policy_coverage_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
quality:
- rule: policy_coverage_uid_required
  description: policy_coverage_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: policy_coverage_policy_uid_required
  description: Policy identifier must be populated for every policy coverage record.
  dimension: completeness
  severity: error
- rule: policy_coverage_coverage_uid_required
  description: Coverage identifier must be populated for every policy coverage record.
  dimension: completeness
  severity: error
- rule: policy_coverage_status_code_required
  description: Coverage status code must be populated for every policy coverage record.
  dimension: completeness
  severity: error
- rule: policy_coverage_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: coverage
  supportsPolicyCoveragePattern: true
  classificationProfile: INTERNAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - identifier-strategy
  - null-semantics
  - product-coverage-modeling
  - record-state
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR.'
  - '0.4.0: Canonical hardening C5 — bind 5 *_code field(s) to codeset(s) (C5.2).'
