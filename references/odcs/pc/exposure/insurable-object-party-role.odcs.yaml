apiVersion: v3.0.2
kind: DataContract
id: pc.insurable-object-party-role
name: InsurableObjectPartyRole
version: 0.1.2
status: proposed
description: Canonical contract for a party participating in an insurable object context — named drivers on a vehicle, additional insureds on a property, loss-payees, lessees, and other object-scoped party
  participations.
domain: property-and-casualty
schema:
- name: insurable_object_party_role
  physicalType: table
  description: Canonical insurable-object party role record that separates reusable party identity from object-scoped participation. Enables canonical expression of "named driver of vehicle", "additional
    insured on building", "loss-payee on property", and similar patterns without overloading the policy or claim context.
  properties:
  - name: insurable_object_party_role_uid
    businessName: Insurable Object Party Role Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical insurable-object party role record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: insurable_object_uid
    businessName: Insurable Object Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the insurable object the party role applies to.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: party_uid
    businessName: Party Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the party participating in the insurable object context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: role_type_code
    businessName: Role Type Code
    logicalType: string
    required: true
    description: Classification of the role the party plays for the insurable object (NAMED_DRIVER, ADDITIONAL_INSURED, LOSS_PAYEE, LESSEE, etc.). References the PartyRoleTypeCode codeset.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: role_status_code
    businessName: Role Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the party role within the insurable-object context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: primary_role_indicator
    businessName: Primary Role Indicator
    logicalType: boolean
    required: false
    description: Indicates whether this is the primary party for the role type within the insurable-object context (e.g. primary named driver).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the party role becomes effective within the insurable-object context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the party role stops being effective within the insurable-object context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    primaryKey: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: insurable_object_party_role_to_insurable_object
  description: Relates the role to the insurable object the party participates in.
  relationshipType: many-to-one
  targetContractId: pc.insurable-object
  sourceFields:
  - insurable_object_uid
  targetFields:
  - insurable_object_uid
- name: insurable_object_party_role_to_party
  description: Relates the role to the party participating in the insurable-object context.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - party_uid
  targetFields:
  - party_uid
- name: insurable_object_party_role_to_role_type
  description: Relates the role to the PartyRoleTypeCode codeset.
  relationshipType: many-to-one
  targetContractId: pc.party-role-type-code
  sourceFields:
  - role_type_code
  targetFields:
  - code_value
- name: insurable_object_party_role_to_role_status
  description: Relates the role to the RoleStatusCode codeset.
  relationshipType: many-to-one
  targetContractId: pc.role-status-code
  sourceFields:
  - role_status_code
  targetFields:
  - code_value
- name: insurable_object_party_role_to_record_status
  description: Relates the role to the RecordStatusCode codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
- name: insurable_object_party_role_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
quality:
- rule: insurable_object_party_role_uid_required
  description: insurable_object_party_role_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: insurable_object_party_role_object_uid_required
  description: insurable_object_uid must be populated for every insurable-object party role record.
  dimension: completeness
  severity: error
- rule: insurable_object_party_role_party_uid_required
  description: party_uid must be populated for every insurable-object party role record.
  dimension: completeness
  severity: error
- rule: insurable_object_party_role_type_code_required
  description: role_type_code must be populated for every insurable-object party role record.
  dimension: completeness
  severity: error
- rule: insurable_object_party_role_status_code_required
  description: role_status_code must be populated for every insurable-object party role record.
  dimension: completeness
  severity: error
- rule: insurable_object_party_role_effective_not_after_expiration
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: exposure
  supportsPartyRolePattern: true
  classificationProfile: INTERNAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - exposure-modeling
  - identifier-strategy
  - null-semantics
  - record-state
  - role-modeling
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.1.0: Initial insurable-object party role contract per role-modeling ADR; canonical hardening C4.3.'
  - '0.1.1: Canonical hardening C5 — bind 1 *_code field(s) to codeset(s) (C5.2).'
  - '0.1.2: Promoted from draft to proposed (M10.6, 2026-05-08).'
