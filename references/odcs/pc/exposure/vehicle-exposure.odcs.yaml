apiVersion: v3.0.2
kind: DataContract
id: pc.vehicle-exposure
name: VehicleExposure
version: 0.1.0
status: draft
description: Canonical contract for vehicle-specific exposure attributes in Property and Casualty insurance.

domain: property-and-casualty

schema:
  - name: vehicle_exposure
    physicalType: table
    description: Canonical vehicle exposure detail that extends the shared exposure record for vehicle-based risk.
    properties:
      - name: vehicle_exposure_id
        businessName: Vehicle Exposure Identifier
        logicalType: string
        required: true
        primaryKey: true
        description: Stable identifier for the canonical vehicle exposure detail record.
      - name: exposure_id
        businessName: Exposure Identifier
        logicalType: string
        required: true
        description: Identifier for the shared exposure record that this vehicle detail extends.
      - name: vehicle_identifier
        businessName: Vehicle Identifier
        logicalType: string
        required: false
        description: Business-facing identifier for the vehicle when available.
      - name: vehicle_year_number
        businessName: Vehicle Year Number
        logicalType: integer
        required: false
        description: Model year of the vehicle.
      - name: vehicle_make_name
        businessName: Vehicle Make Name
        logicalType: string
        required: false
        description: Manufacturer or make name of the vehicle.
      - name: vehicle_model_name
        businessName: Vehicle Model Name
        logicalType: string
        required: false
        description: Model name of the vehicle.
      - name: vehicle_use_code
        businessName: Vehicle Use Code
        logicalType: string
        required: false
        description: Classification of how the vehicle is used in the insured context.
      - name: vehicle_class_code
        businessName: Vehicle Class Code
        logicalType: string
        required: false
        description: Rating, underwriting, or analytical classification of the vehicle.
      - name: garaging_location_id
        businessName: Garaging Location Identifier
        logicalType: string
        required: false
        description: Identifier for the geographic location where the vehicle is principally garaged.
      - name: radius_code
        businessName: Radius Code
        logicalType: string
        required: false
        description: Classification of the operating radius or distance band for the vehicle when applicable.
      - name: stated_value_amount
        businessName: Stated Value Amount
        logicalType: decimal
        required: false
        description: Stated value of the vehicle when used for underwriting, rating, or analytics.
      - name: created_datetime
        businessName: Created Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical vehicle exposure detail record was created.
      - name: updated_datetime
        businessName: Updated Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical vehicle exposure detail record was last updated.

relationships:
  - name: vehicle_exposure_to_exposure
    description: Relates vehicle exposure detail to the shared exposure record.
    relationshipType: many-to-one
    targetContractId: pc.exposure
    sourceFields:
      - exposure_id
    targetFields:
      - exposure_id
  - name: vehicle_exposure_to_garaging_location
    description: Relates vehicle exposure detail to the vehicle garaging location when available.
    relationshipType: many-to-one
    targetContractId: pc.geographic-location
    sourceFields:
      - garaging_location_id
    targetFields:
      - geographic_location_id

quality:
  - rule: vehicle_exposure_id_required
    description: Vehicle exposure identifier must be populated.
    dimension: completeness
    severity: error
  - rule: vehicle_exposure_exposure_id_required
    description: Exposure identifier must be populated for every vehicle exposure detail record.
    dimension: completeness
    severity: error
  - rule: vehicle_exposure_year_valid
    description: Vehicle year number should be a reasonable model year when populated.
    dimension: validity
    severity: warning
  - rule: vehicle_exposure_stated_value_not_negative
    description: Stated value amount should not be negative when populated.
    dimension: validity
    severity: warning

customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: exposure
  exposureSubtype: vehicle
  supportsExposurePattern: true
