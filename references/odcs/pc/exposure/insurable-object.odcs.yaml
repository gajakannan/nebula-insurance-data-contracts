apiVersion: v3.0.2
kind: DataContract
id: pc.insurable-object
name: InsurableObject
version: 0.4.0
status: draft
description: Canonical contract for an object, property, vehicle, operation, interest, or location that may be insured in Property and Casualty insurance.
domain: property-and-casualty
schema:
- name: insurable_object
  physicalType: table
  description: Canonical insurable object record that identifies what may be insured separately from the measurable exposure associated with it.
  properties:
  - name: insurable_object_uid
    businessName: Insurable Object Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical insurable object record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: insurable_object_type_code
    businessName: Insurable Object Type Code
    logicalType: string
    required: true
    description: Classification of the thing, operation, interest, or location that may be insured.
    customProperties:
      classifications:
        sensitivity: INTERNAL
      codesetExempt: true
      codesetExemptReason: Polymorphic across insurable-object subtypes; canonical taxonomy captured by exposure subtypes.
  - name: insurable_object_name
    businessName: Insurable Object Name
    logicalType: string
    required: false
    description: Business-facing name or label for the insurable object.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: insurable_object_classification_uid
    businessName: Insurable Object Classification Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the durable classification associated with the insurable object when classification detail is represented separately.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: geographic_location_uid
    businessName: Geographic Location Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the geographic location associated with the insurable object when location context is available.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: insurable_object_status_code
    businessName: Insurable Object Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the insurable object.
    customProperties:
      classifications:
        sensitivity: INTERNAL
      codesetExempt: true
      codesetExemptReason: Insurable-object lifecycle state; canonical codeset deferred until insurable-object modeling expands.
  - name: insurable_object_description
    businessName: Insurable Object Description
    logicalType: string
    required: false
    description: Source-neutral business description of the insurable object when additional context is needed.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the insurable object becomes effective in the business context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the insurable object stops being effective in the business context.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical insurable object record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical insurable object record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: insurable_object_to_classification
  description: Relates an insurable object to its durable classification when classification detail is available.
  relationshipType: many-to-one
  targetContractId: pc.insurable-object-classification
  sourceFields:
  - insurable_object_classification_uid
  targetFields:
  - insurable_object_classification_uid
- name: insurable_object_to_geographic_location
  description: Relates an insurable object to its geographic location when location context is available.
  relationshipType: many-to-one
  targetContractId: pc.geographic-location
  sourceFields:
  - geographic_location_uid
  targetFields:
  - geographic_location_uid
- name: insurable_object_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
- name: insurable_object_record_status_code_to_record_status_code
  description: Binds record_status_code to the canonical record-status-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
quality:
- rule: insurable_object_uid_required
  description: insurable_object_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: insurable_object_type_code_required
  description: Insurable object type code must be populated.
  dimension: completeness
  severity: error
- rule: insurable_object_status_code_required
  description: Insurable object status code must be populated.
  dimension: completeness
  severity: error
- rule: insurable_object_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: exposure
  supportsExposurePattern: true
  classificationProfile: CONFIDENTIAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - exposure-modeling
  - identifier-strategy
  - null-semantics
  - record-state
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR; re-tag narrative free-text field(s) to CONFIDENTIAL + PII: insurable_object_description; raise
    classificationProfile INTERNAL → CONFIDENTIAL (matches max field sensitivity).'
  - '0.4.0: Canonical hardening C5 — bind 2 *_code field(s) to codeset(s) (C5.2); add codesetExempt to 2 field(s) (C5.2).'
