apiVersion: v3.0.2
kind: DataContract
id: pc.account
name: Account
version: 0.1.1
status: draft
description: Canonical contract for a commercial-lines account — the master customer record that owns one or more policies, agreements, and submissions.
domain: property-and-casualty
schema:
- name: account
  physicalType: table
  description: Canonical account record used by commercial lines to roll up policies, agreements, and submissions to a master customer entity. Carries a self-referencing primary parent for the simple corporate-hierarchy
    case; richer multi-parent semantics live on AccountRelationship.
  properties:
  - name: account_uid
    businessName: Account Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical account record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: account_number
    businessName: Account Number
    logicalType: string
    required: true
    description: Business-facing number assigned to the account.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: account_name
    businessName: Account Name
    logicalType: string
    required: true
    description: Business-facing name of the account (typically the legal name of the master customer organization).
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: account_type_code
    businessName: Account Type Code
    logicalType: string
    required: true
    description: Classification of the account organization (CORPORATE, PARTNERSHIP, LLC, ASSOCIATION, CAPTIVE, MASTER_PROGRAM, INDIVIDUAL_LARGE, etc.). References the AccountTypeCode codeset.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: account_status_code
    businessName: Account Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the account (ACTIVE, PROSPECT, INACTIVE, CLOSED, MERGED). References the AccountStatusCode codeset.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: parent_account_uid
    businessName: Parent Account Identifier
    logicalType: string
    required: false
    description: Identifier (GUID reference) for the primary parent account when the account belongs to a corporate hierarchy. Self-references the canonical account contract. Multi-parent or non-primary
      parent relationships live on AccountRelationship.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: primary_party_uid
    businessName: Primary Party Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the legal-entity Party that the account represents. Connects the operational account record to canonical party identity.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the account becomes effective for business use.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the account stops being effective for business use. Null indicates an open-ended account.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: account_description
    businessName: Account Description
    logicalType: string
    required: false
    description: Source-neutral business description of the account when additional context is needed.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    primaryKey: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: account_to_account_type
  description: Relates an account to the AccountTypeCode codeset.
  relationshipType: many-to-one
  targetContractId: pc.account-type-code
  sourceFields:
  - account_type_code
  targetFields:
  - code_value
- name: account_to_account_status
  description: Relates an account to the AccountStatusCode codeset.
  relationshipType: many-to-one
  targetContractId: pc.account-status-code
  sourceFields:
  - account_status_code
  targetFields:
  - code_value
- name: account_to_parent_account
  description: Relates an account to its primary parent account in the corporate hierarchy.
  relationshipType: many-to-one
  targetContractId: pc.account
  sourceFields:
  - parent_account_uid
  targetFields:
  - account_uid
- name: account_to_primary_party
  description: Relates an account to the legal-entity Party that the account represents.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - primary_party_uid
  targetFields:
  - party_uid
- name: account_to_record_status
  description: Relates an account to the RecordStatusCode codeset.
  relationshipType: many-to-one
  targetContractId: pc.record-status-code
  sourceFields:
  - record_status_code
  targetFields:
  - code_value
- name: account_source_system_code_to_source_system_code
  description: Binds source_system_code to the canonical source-system-code codeset.
  relationshipType: many-to-one
  targetContractId: pc.source-system-code
  sourceFields:
  - source_system_code
  targetFields:
  - code_value
quality:
- rule: account_uid_required
  description: account_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: account_number_required
  description: account_number must be populated for every account record.
  dimension: completeness
  severity: error
- rule: account_name_required
  description: account_name must be populated for every account record.
  dimension: completeness
  severity: error
- rule: account_status_code_required
  description: account_status_code must be populated for every account record.
  dimension: completeness
  severity: error
- rule: account_primary_party_uid_required
  description: primary_party_uid must be populated for every account record.
  dimension: completeness
  severity: error
- rule: account_parent_not_self_reference
  description: parent_account_uid must not equal account_uid when populated.
  dimension: consistency
  severity: error
- rule: account_effective_not_after_expiration
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: core
  classificationProfile: CONFIDENTIAL
  adrs:
  - authoring-source-primacy
  - canonical-alignment
  - codeset-strategy
  - data-classification
  - entity-boundaries
  - identifier-strategy
  - null-semantics
  - record-state
  - scd2-primary-key
  - status-promotion
  - temporal-modeling
  - versioning-policy
  changelog:
  - '0.1.0: Initial Account contract per role-modeling and entity-boundaries ADRs; canonical hardening C4.5 ship decision (commercial-lines focus).'
  - '0.1.1: Canonical hardening C5 — bind 1 *_code field(s) to codeset(s) (C5.2).'
