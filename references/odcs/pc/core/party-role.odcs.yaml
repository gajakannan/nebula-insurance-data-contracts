apiVersion: v3.0.2
kind: DataContract
id: pc.party-role
name: PartyRole
version: 0.1.0
status: draft
description: Canonical contract for a party participating in a business context in Property and Casualty insurance.

domain: property-and-casualty

schema:
  - name: party_role
    physicalType: table
    description: Canonical party role record that separates reusable party identity from contextual participation.
    properties:
      - name: party_role_id
        businessName: Party Role Identifier
        logicalType: string
        required: true
        primaryKey: true
        description: Stable identifier for the canonical party role record.
      - name: party_id
        businessName: Party Identifier
        logicalType: string
        required: true
        description: Identifier for the party participating in the role.
      - name: role_type_code
        businessName: Role Type Code
        logicalType: string
        required: true
        description: Classification of the role the party plays in the business context.
      - name: context_type_code
        businessName: Context Type Code
        logicalType: string
        required: true
        description: Classification of the business context for the role, such as submission, policy, claim, account, agreement, coverage, or exposure.
      - name: context_id
        businessName: Context Identifier
        logicalType: string
        required: false
        description: Identifier of the business context where the party role applies when the context has a canonical identifier.
      - name: role_status_code
        businessName: Role Status Code
        logicalType: string
        required: true
        description: Current lifecycle status of the party role within its business context.
      - name: primary_role_indicator
        businessName: Primary Role Indicator
        logicalType: boolean
        required: false
        description: Indicates whether this party role is the primary role of its type within the business context.
      - name: effective_date
        businessName: Effective Date
        logicalType: date
        required: false
        description: Date when the party role becomes effective in the business context.
      - name: expiration_date
        businessName: Expiration Date
        logicalType: date
        required: false
        description: Date when the party role stops being effective in the business context.
      - name: created_datetime
        businessName: Created Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical party role record was created.
      - name: updated_datetime
        businessName: Updated Datetime
        logicalType: datetime
        required: false
        description: Datetime when the canonical party role record was last updated.

relationships:
  - name: party_role_to_party
    description: Relates a party role to the reusable party identity that participates in the context.
    relationshipType: many-to-one
    targetContractId: pc.party
    sourceFields:
      - party_id
    targetFields:
      - party_id

quality:
  - rule: party_role_id_required
    description: Party role identifier must be populated.
    dimension: completeness
    severity: error
  - rule: party_role_party_id_required
    description: Party identifier must be populated for every party role.
    dimension: completeness
    severity: error
  - rule: party_role_type_code_required
    description: Role type code must be populated for every party role.
    dimension: completeness
    severity: error
  - rule: party_role_context_type_code_required
    description: Context type code must be populated for every party role.
    dimension: completeness
    severity: error
  - rule: party_role_effective_date_not_after_expiration_date
    description: Effective date must not be later than expiration date when both dates are populated.
    dimension: consistency
    severity: error

customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: core
  supportsPartyRolePattern: true
