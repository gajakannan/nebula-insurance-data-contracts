apiVersion: v3.0.2
kind: DataContract
id: pc.party-relationship
name: PartyRelationship
version: 0.3.0
status: draft
description: Canonical contract for a durable relationship between two parties in Property and Casualty insurance.
domain: property-and-casualty
schema:
- name: party_relationship
  physicalType: table
  description: Canonical party-to-party relationship record for relationships that are not limited to one policy, claim, submission, or other business context.
  properties:
  - name: party_relationship_uid
    businessName: Party Relationship Identifier
    logicalType: string
    required: true
    primaryKey: true
    description: Immutable system-generated GUID that uniquely identifies the canonical party relationship record across snapshots and source systems.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_system_code
    businessName: Source System Code
    logicalType: string
    required: false
    description: Identifier of the upstream system that produced or last asserted this record. Used for multi-source mastering and lineage.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: source_natural_key
    businessName: Source Natural Key
    logicalType: string
    required: false
    description: Natural key assigned by the source system. Captured for provenance; not used as the canonical primary key.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: from_party_uid
    businessName: From Party Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the party where the relationship direction starts.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: to_party_uid
    businessName: To Party Identifier
    logicalType: string
    required: true
    description: Identifier (GUID reference) for the party where the relationship direction ends.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: relationship_type_code
    businessName: Relationship Type Code
    logicalType: string
    required: true
    description: Classification of the relationship between the two parties.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: relationship_status_code
    businessName: Relationship Status Code
    logicalType: string
    required: true
    description: Current lifecycle status of the party relationship.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: relationship_description
    businessName: Relationship Description
    logicalType: string
    required: false
    description: Source-neutral business description of the party relationship when additional context is needed.
    customProperties:
      classifications:
        sensitivity: CONFIDENTIAL
        regulatoryTags:
        - PII
  - name: effective_date
    businessName: Effective Date
    logicalType: date
    required: false
    description: Date when the party relationship becomes effective.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: expiration_date
    businessName: Expiration Date
    logicalType: date
    required: false
    description: Date when the party relationship stops being effective.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: created_datetime
    businessName: Created Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical party relationship record was created.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: updated_datetime
    businessName: Updated Datetime
    logicalType: datetime
    required: false
    description: Datetime when the canonical party relationship record was last updated.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: record_status_code
    businessName: Record Status Code
    logicalType: string
    required: true
    description: Warehouse-level state of the record. References the RecordStatusCode codeset (ACTIVE, SUPERSEDED, SOFT_DELETED, RESTATED, MERGED).
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: valid_from_datetime
    businessName: Valid From Datetime
    logicalType: datetime
    required: true
    description: System-time start of the SCD2 window for this record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
    primaryKey: true
  - name: valid_to_datetime
    businessName: Valid To Datetime
    logicalType: datetime
    required: false
    description: System-time end of the SCD2 window for this record version. Null indicates the current row.
    customProperties:
      classifications:
        sensitivity: INTERNAL
  - name: is_current_indicator
    businessName: Is Current Indicator
    logicalType: boolean
    required: true
    description: True for exactly one row per logical key, indicating the current record version.
    customProperties:
      classifications:
        sensitivity: INTERNAL
relationships:
- name: party_relationship_from_party
  description: Relates a party relationship to the party where the relationship direction starts.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - from_party_uid
  targetFields:
  - party_uid
- name: party_relationship_to_party
  description: Relates a party relationship to the party where the relationship direction ends.
  relationshipType: many-to-one
  targetContractId: pc.party
  sourceFields:
  - to_party_uid
  targetFields:
  - party_uid
quality:
- rule: party_relationship_uid_required
  description: party_relationship_uid must be populated for every record.
  dimension: completeness
  severity: error
- rule: party_relationship_from_party_uid_required
  description: From party identifier must be populated for every party relationship.
  dimension: completeness
  severity: error
- rule: party_relationship_to_party_uid_required
  description: To party identifier must be populated for every party relationship.
  dimension: completeness
  severity: error
- rule: party_relationship_type_code_required
  description: Relationship type code must be populated for every party relationship.
  dimension: completeness
  severity: error
- rule: party_relationship_parties_must_differ
  description: From party identifier and to party identifier should not identify the same party unless the relationship type explicitly allows self-reference.
  dimension: validity
  severity: warning
- rule: party_relationship_effective_date_not_after_expiration_date
  description: Effective date must not be later than expiration date when both dates are populated.
  dimension: consistency
  severity: error
- rule: valid_from_datetime_required
  description: valid_from_datetime must be populated for every record version.
  dimension: completeness
  severity: error
- rule: valid_window_consistent
  description: valid_to_datetime must be greater than valid_from_datetime when populated.
  dimension: consistency
  severity: error
- rule: single_current_row_per_key
  description: Exactly one row per logical key has is_current_indicator equal to true.
  dimension: uniqueness
  severity: error
- rule: record_status_code_required
  description: record_status_code must be populated for every record.
  dimension: completeness
  severity: error
customProperties:
  canonicalLayer: silver
  contractFamily: property-and-casualty
  domainPackage: pc
  subjectArea: core
  supportsPartyRolePattern: true
  classificationProfile: CONFIDENTIAL
  changelog:
  - '0.2.0: Apply cross-cutting ADRs (identifier strategy, SCD2 temporal, record state, classifications, codeset references, source attribution).'
  - '0.3.0: Canonical hardening C3 — composite SCD2 PK on (uid, valid_from_datetime) per scd2-primary-key ADR; re-tag narrative free-text field(s) to CONFIDENTIAL + PII: relationship_description; raise
    classificationProfile INTERNAL → CONFIDENTIAL (matches max field sensitivity).'
